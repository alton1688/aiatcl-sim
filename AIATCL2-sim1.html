], "a": [0, 1, 2], "e": "生成式 AI 本身帶有隨機性，可透過範本與參數控制一致性。", "ref": "生成式人工智慧與機器學習導論 2025（李宏毅）；Prompt Engineering（OpenAI）"}, {"id": "Q232", "s": 2, "n": 47, "t": "主題4", "sub": "4.1", "sn": "故障排除和問題解決", "q": "AI 拒絕回答一個正當的工作問題時，下列哪些做法恰當？", "o": ["了解可能觸發了安全限制", "說明正當用途並改寫問題", "使用越獄技巧繞過安全機制", "仍無法時改用其他方式或尋求協助"], "a": [0, 1, 3], "e": "越獄屬於提示注入行為，違反使用規範並可能帶來風險。", "ref": "OWASP GenAI LLM Top 10 2026（OWASP GenAI Security Project）；Prompt Engineering Overview（Anthropic）"}, {"id": "Q233", "s": 3, "n": 47, "t": "主題4", "sub": "4.1", "sn": "故障排除和問題解決", "q": "排除 AI 使用問題時，建議的檢查順序為何？", "o": ["先檢查電腦硬體 → 再重新安裝軟體 → 最後改提示", "直接放棄使用 AI", "先更換工具 → 再檢查資料 → 最後檢查提示", "先檢查提示是否清楚 → 再檢查提供的資料是否足夠 → 再檢查工具或模型是否合適"], "a": [3], "e": "多數問題源於提示與資料不足，應先從自己能調整的部分著手。", "ref": "Prompt Engineering（OpenAI）；Google AI Essentials（Google）"}, {"id": "Q234", "s": 4, "n": 47, "t": "主題4", "sub": "4.1", "sn": "故障排除和問題解決", "q": "在提示中「允許 AI 說不知道」，有哪些作用？", "o": ["會讓 AI 完全無法工作", "特別適合事實型問題", "降低 AI 硬掰答案的情況", "是 Anthropic 減少幻覺的建議做法"], "a": [1, 2, 3], "e": "允許表達不確定能減少為了回答而捏造內容。", "ref": "Prompt Engineering Overview（Anthropic）"}, {"id": "Q235", "s": 5, "n": 47, "t": "主題4", "sub": "4.1", "sn": "故障排除和問題解決", "q": "「交叉驗證」AI 回答的方法包括哪些？", "o": ["查詢官方原始來源", "把同一個答案重複貼上確認", "請同一個 AI 再肯定一次答案", "換個問法再問一次"], "a": [0, 3], "e": "以不同方式或來源比對，才能發現錯誤。同一來源再次確認不算交叉驗證。", "ref": "Prompt Engineering（OpenAI）；Google AI Essentials（Google）"}, {"id": "Q236", "s": 1, "n": 48, "t": "主題4", "sub": "4.1", "sn": "故障排除和問題解決", "q": "依任務「選對工具」，下列哪些做法恰當？", "o": ["所有任務都用同一個工具效果最好", "影像相關任務使用多模態模型", "需要最新資訊時使用搜尋功能", "多步驟推理任務使用推理模型"], "a": [1, 2, 3], "e": "不同工具與模型各有擅長，選對工具能提升品質。", "ref": "生成式人工智慧與機器學習導論 2025（李宏毅）；Google AI Essentials（Google）"}, {"id": "Q237", "s": 2, "n": 48, "t": "主題4", "sub": "4.1", "sn": "故障排除和問題解決", "q": "下列哪些情況應停止依賴 AI，改尋求 AI 以外的支援？", "o": ["涉及他人權益的重大決定", "發現疑似資安事件", "需要醫療、法律或財務的專業判斷", "請 AI 把一段文字改得更口語"], "a": [0, 1, 2], "e": "高風險與專業判斷需由專家或權責單位處理。", "ref": "行政院及所屬機關（構）使用生成式 AI 參考指引（行政院）；Generative AI for Everyone（Andrew Ng／DeepLearning.AI）"}, {" ，說明持續學習的必要。", "ref": "OWASP GenAI LLM Top 10 2026（OWASP GenAI Security Project）"}, {"id": "Q250", "s": 5, "n": 50, "t": "主題4", "sub": "4.2", "sn": "跟進生成式 AI 的最新進展", "q": "在組織內促進持續學習 AI 的做法包括哪些？", "o": ["定期實作分享", "舉辦讀書會", "成立 AI 交流社群", "禁止同仁交流使用經驗"], "a": [0, 1, 2], "e": "同儕交流是持續學習最有效的方式之一。", "ref": "Build Effective Generative AI Solutions in Your Organization（Microsoft Learn）；【好好用 AI 素養計劃】負責任使用 AI（台灣人工智慧學校）"}];
const TOPICS = {"主題1": "AI 基礎與生成式 AI 原理", "主題2": "職場實踐與進階技巧", "主題3": "負責任和安全的生成式 AI 使用", "主題4": "維護和成長"};
const L = "ABCD";
const $ = s => document.querySelector(s);
let current = [], submitted = false, timerId = null, endAt = 0;

/* theme */
(function(){
  let saved = null;
  try { saved = localStorage.getItem("aiatcl-theme"); } catch(e) {}
  if (saved) document.documentElement.dataset.theme = saved;
  $("#themeBtn").addEventListener("click", () => {
    const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("aiatcl-theme", next); } catch(e) {}
  });
})();

const modes = [
  ...[1,2,3,4,5].map(s => ({key:"s"+s, label:`模擬卷 第 ${s} 回`, exam:true, filter:q => q.s === s})),
  ...Object.keys(TOPICS).map(t => ({key:t, label:`${t}｜${TOPICS[t]}`, exam:false, filter:q => q.t === t})),
  {key:"all", label:"全部 250 題", exam:false, filter:() => true},
];
const modesEl = $("#modes");
modes.forEach(m => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = m.label; b.dataset.key = m.key;
  b.setAttribute("aria-pressed","false");
  b.addEventListener("click", () => start(m));
  modesEl.appendChild(b);
});

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function start(m){
  document.querySelectorAll("#modes button").forEach(b => b.setAttribute("aria-pressed", b.dataset.key === m.key));
  current = DATA.filter(m.filter);
  if ($("#optShuffle").checked) current = current.map(v => [Math.random(), v]).sort((a,b) => a[0]-b[0]).map(v => v[1]);
  submitted = false;
  $("#resultTop").innerHTML = "";
  const study = $("#optStudy").checked;
  const quiz = $("#quiz");
  quiz.innerHTML = current.map((q, i) => `
    <article class="q" id="${q.id}" data-i="${i}">
      <div class="qhead"><span class="qno">第 ${i+1} 題</span>
        <span class="tag">${q.t}・${q.sub} ${esc(q.sn)}</span><span class="tag">${q.id}</span></div>
      <p class="qtext">${esc(q.q)}</p>
      ${q.o.map((o, k) => `<label class="opt" data-k="${k}"><input type="checkbox" name="${q.id}" value="${k}">
        <span class="letter">(${L[k]})</span><span>${esc(o)}</span></label>`).join("")}
      ${study ? `<button class="btn" type="button" data-check="${i}" style="margin-top:6px">確認答案</button>` : ""}
      <div class="feedback"></div>
    </article>`).join("");
  quiz.querySelectorAll("[data-check]").forEach(b => b.addEventListener("click", () => reveal(+b.dataset.check)));
  quiz.addEventListener("change", updateProgress);
  $("#bar").hidden = false;
  updateProgress();
  clearInterval(timerId); $("#timer").textContent = "";
  if (m.exam && $("#optTimer").checked){
    endAt = Date.now() + 60*60*1000;
    tick(); timerId = setInterval(tick, 1000);
  }
  $("#bar").scrollIntoView({behavior:"smooth"});
}

function tick(){
  const left = Math.max(0, endAt - Date.now());
  const mm = String(Math.floor(left/60000)).padStart(2,"0"), ss = String(Math.floor(left%60000/1000)).padStart(2,"0");
  $("#timer").textContent = `剩餘 ${mm}:${ss}`;
  if (left === 0 && !submitted){ clearInterval(timerId); submit(true); }
}

function picked(q){ return [...document.querySelectorAll(`input[name="${q.id}"]:checked`)].map(i => +i.value); }
function same(a, b){ return a.length === b.length && a.every(x => b.includes(x)); }

function updateProgress(){
  const done = current.filter(q => picked(q).length).length;
  $("#progress").textContent = `已作答 ${done} / ${current.length} 題`;
}

function reveal(i){
  const q = current[i], el = document.getElementById(q.id), mine = picked(q), ok = same(mine, q.a);
  el.classList.add("show"); el.classList.toggle("correct", ok); el.classList.toggle("wrong", !ok);
  el.querySelectorAll(".opt").forEach(o => {
    const k = +o.dataset.k;
    o.classList.toggle("is-answer", q.a.includes(k));
    o.classList.toggle("is-miss", mine.includes(k) && !q.a.includes(k));
  });
  el.querySelector(".feedback").innerHTML =
    `<span class="verdict ${ok ? "ok" : "bad"}">${ok ? "答對了（+2 分）" : "未完全答對"}</span>　正確答案：<b>${q.a.map(k => L[k]).join("、")}</b>${mine.length ? "　你的答案：" + mine.map(k => L[k]).join("、") : "　（未作答）"}
     <div style="margin-top:6px">${esc(q.e)}</div><div class="ref">參考資源：${esc(q.ref)}</div>`;
  return ok;
}

function submit(timeUp){
  if (!current.length) return;
  submitted = true; clearInterval(timerId);
  let right = 0; const byT = {};
  current.forEach((q, i) => {
    const ok = reveal(i);
    byT[q.t] = byT[q.t] || {n:0, ok:0}; byT[q.t].n++; if (ok){ right++; byT[q.t].ok++; }
    document.getElementById(q.id).querySelectorAll("input").forEach(x => x.disabled = true);
  });
  const pct = right / current.length, score100 = Math.round(pct * 100);
  const pass = score100 >= 80;
  $("#resultTop").innerHTML = `<section class="panel"><h2>${timeUp ? "時間到，已自動交卷" : "成績"}</h2>
    <div class="score">
      <div class="stat"><div class="k">完全答對</div><div class="v">${right} / ${current.length}</div></div>
      <div class="stat"><div class="k">${current.length === 50 ? "得分（每題 2 分）" : "換算百分制"}</div><div class="v">${current.length === 50 ? right*2 : score100}</div></div>
      <div class="stat"><div class="k">結果（80 分通過）</div><div class="v ${pass ? "pass" : "fail"}">${pass ? "通過" : "未通過"}</div></div>
    </div>
    <table class="bd"><tr><th>主題</th><th>答對</th><th>題數</th><th>答對率</th></tr>
    ${Object.keys(byT).sort().map(t => `<tr><td>${t}｜${TOPICS[t]}</td><td>${byT[t].ok}</td><td>${byT[t].n}</td><td>${Math.round(byT[t].ok/byT[t].n*100)}%</td></tr>`).join("")}
    </table>
    <p style="font-size:15px;color:var(--muted);margin:12px 0 0">各題下方已顯示正確答案、說明與參考資源；綠色為答對、紅色為未完全答對。</p></section>`;
  $("#resultTop").scrollIntoView({behavior:"smooth"});
}

$("#submitBtn").addEventListener("click", () => {
  const blank = current.filter(q => !picked(q).length).length;
  if (blank && !confirm(`還有 ${blank} 題未作答，確定要交卷嗎？`)) return;
  submit(false);
});
$("#resetBtn").addEventListener("click", () => {
  const m = modes.find(m => m.key === document.querySelector('#modes button[aria-pressed="true"]')?.dataset.key);
  if (m) start(m);
});
</script>
</body>
</html>
