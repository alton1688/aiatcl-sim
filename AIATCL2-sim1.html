<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIATCL 2.0 模擬考題練習</title>
<style>
:root{
  --bg:#F6F4EE; --card:#FFFDF8; --ink:#1B2A41; --muted:#4A5568; --line:#E3DFD3;
  --navy:#13233A; --accent:#2E6BE6; --accent-soft:#E8EEF9; --warm:#F2A65A;
  --ok:#1F7A4D; --ok-soft:#E3F3EA; --bad:#B4432E; --bad-soft:#FBE8E3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A2B; --card:#16243A; --ink:#E9EEF5; --muted:#AFBCCD; --line:#2A3B55;
    --navy:#0A1322; --accent:#7EA6F5; --accent-soft:#1E3256; --warm:#F2A65A;
    --ok:#6FD3A0; --ok-soft:#173A2B; --bad:#F29A86; --bad-soft:#40211B;
  }
}
:root[data-theme="dark"]{
    --bg:#0F1A2B; --card:#16243A; --ink:#E9EEF5; --muted:#AFBCCD; --line:#2A3B55;
    --navy:#0A1322; --accent:#7EA6F5; --accent-soft:#1E3256; --warm:#F2A65A;
    --ok:#6FD3A0; --ok-soft:#173A2B; --bad:#F29A86; --bad-soft:#40211B;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:18px;line-height:1.65}
header.top{background:var(--navy);color:#F6F4EE;padding:28px 16px 24px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header.top .wrap{padding:0}
.eyebrow{color:var(--warm);font-weight:700;letter-spacing:.06em;font-size:15px;margin:0 0 6px}
h1{font-size:clamp(26px,4vw,38px);margin:0 0 6px;line-height:1.25}
.sub{color:#C9D6E8;margin:0;font-size:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:20px 0}
.panel h2{font-size:20px;margin:0 0 12px}
.modes{display:flex;flex-wrap:wrap;gap:10px}
.modes button,.btn{font:inherit;font-size:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  padding:10px 16px;border-radius:999px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.opts-line{display:flex;flex-wrap:wrap;gap:16px;align-items:center;font-size:16px;color:var(--muted);margin-top:14px}
.opts-line label{display:flex;gap:6px;align-items:center;cursor:pointer}
.stickybar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0}
.stickybar .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.progress{font-size:16px;color:var(--muted)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:16px 0}
.q.correct{border-color:var(--ok);box-shadow:inset 6px 0 0 var(--ok)}
.q.wrong{border-color:var(--bad);box-shadow:inset 6px 0 0 var(--bad)}
.qhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.qno{font-weight:800;color:var(--accent);font-size:18px}
.tag{font-size:13px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.qtext{font-weight:700;margin:4px 0 12px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;background:var(--bg)}
.opt input{width:22px;height:22px;margin-top:3px;flex:none;accent-color:var(--accent)}
.opt .letter{font-weight:800;min-width:1.6em}
.opt.is-answer{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-miss{border-color:var(--bad);background:var(--bad-soft)}
.feedback{display:none;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:16px}
.feedback b{color:var(--ink)}
.show .feedback{display:block}
.verdict{font-weight:800}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.ref{color:var(--muted);font-size:14px;margin-top:6px}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:12px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .k{font-size:14px;color:var(--muted)} .stat .v{font-size:28px;font-weight:800}
.pass{color:var(--ok)} .fail{color:var(--bad)}
table.bd{width:100%;border-collapse:collapse;margin-top:14px;font-size:16px}
table.bd th,table.bd td{border-bottom:1px solid var(--line);padding:8px;text-align:left}
footer{color:var(--muted);font-size:14px;padding:24px 0 48px}
.theme-toggle{position:absolute;right:16px;top:16px;background:transparent;border:1px solid #3a4d6b;color:#F6F4EE;border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
@media (max-width:600px){ body{font-size:17px} .q{padding:16px} }
</style>
</head>
<body>
<header class="top" style="position:relative">
  <button class="theme-toggle" id="themeBtn" type="button">深淺色</button>
  <div class="wrap">
    <p class="eyebrow">AIATCL 2.0 AI 素養人才認證</p>
    <h1>模擬考題練習（250 題）</h1>
    <p class="sub">依台灣人工智慧學校 AIATCL 2.0 認證題綱（2026/8/11）編寫｜講師 鄭迦聲 (Alton)</p>
  </div>
</header>

<main class="wrap">
  <section class="panel" id="setup">
    <h2>選擇練習範圍</h2>
    <div class="modes" id="modes"></div>
    <div class="opts-line">
      <label><input type="checkbox" id="optStudy"> 練習模式：每題作答後立即顯示答案</label>
      <label><input type="checkbox" id="optShuffle"> 打亂題目順序</label>
      <label><input type="checkbox" id="optTimer" checked> 模擬卷計時 60 分鐘</label>
    </div>
    <p style="font-size:15px;color:var(--muted);margin:14px 0 0">規則比照簡章：多重選擇題，每題四個選項、正確答案一個以上，須選出所有正確答案；完全答對得 2 分，50 題滿分 100 分，80 分以上通過。本頁計分僅以「完全答對」計算。</p>
  </section>

  <div id="resultTop"></div>
</main>

<div class="stickybar" id="bar" hidden>
  <div class="wrap">
    <span class="progress" id="progress"></span>
    <span class="timer" id="timer"></span>
    <span style="display:flex;gap:8px">
      <button class="btn" id="resetBtn" type="button">重新開始</button>
      <button class="btn primary" id="submitBtn" type="button">交卷計分</button>
    </span>
  </div>
</div>

<main class="wrap" id="quiz"></main>

<footer class="wrap">本練習題為依 AIATCL 2.0 認證題綱與簡章學習資源自行編寫，並非官方考題；實際測驗範圍以認證大綱為準。</footer>

<script>
const DATA = [{"id": "Q001", "s": 1, "n": 1, "t": "主題1", "sub": "1.1", "sn": "人工智慧概論與演進", "q": "依我國《人工智慧基本法》第 3 條，人工智慧的定義包含哪些要素？", "o": ["必須具備人類的自我意識", "具自主運行能力之系統", "產出預測、內容、建議或決策等影響實體或虛擬環境之結果", "透過輸入或感測，經由機器學習及演算法運作"], "a": [1, 2, 3], "e": "法條定義強調自主運行、機器學習與演算法、產出預測／內容／建議／決策；並未要求具備意識。", "ref": "人工智慧基本法（全國法規資料庫）"}, {"id": "Q002", "s": 2, "n": 1, "t": "主題1", "sub": "1.1", "sn": "人工智慧概論與演進", "q": "關於 AI、機器學習（ML）、深度學習（DL）與生成式 AI 的關係，下列哪些正確？", "o": ["生成式 AI 多以深度學習模型為基礎", "人工智慧是深度學習的子集合", "深度學習是使用多層神經網路的機器學習方法", "機器學習是人工智慧的一個子領域"], "a": [0, 2, 3], "e": "包含關係為 AI ⊃ ML ⊃ DL，生成式 AI 多建立在深度學習之上；AI 範圍最大。", "ref": "Elements of AI（University of Helsinki & MinnaLearn）；Google AI Essentials（Google）"}, {"id": "Q003", "s": 3, "n": 1, "t": "主題1", "sub": "1.1", "sn": "人工智慧概論與演進", "q": "「人工智慧（Artificial Intelligence）」一詞正式提出的場合是？", "o": ["2012 年 ImageNet 影像辨識競賽", "1956 年達特茅斯會議", "1997 年 Deep Blue 對弈", "2022 年 ChatGPT 發表"], "a": [1], "e": "1956 年達特茅斯會議被視為 AI 學科的起點，「人工智慧」一詞於此正式使用。", "ref": "Elements of AI（University of Helsinki & MinnaLearn）"}, {"id": "Q004", "s": 4, "n": 1, "t": "主題1", "sub": "1.1", "sn": "人工智慧概論與演進", "q": "圖靈測試（Turing Test）的主要目的為何？", "o": ["判斷機器能否表現出與人類難以區分的智慧行為", "測量電腦的運算速度", "評估網路系統的資安強度", "測試硬體的耗能效率"], "a": [0], "e": "圖靈於 1950 年提出以對話測試判斷機器是否能表現出類似人類的智慧。", "ref": "Elements of AI（University of Helsinki & MinnaLearn）"}, {"id": "Q005", "s": 5, "n": 1, "t": "主題1", "sub": "1.1", "sn": "人工智慧概論與演進", "q": "關於 1970–1980 年代的「專家系統」，下列哪些敘述正確？", "o": ["主要透過大量資料自動學習規律", "曾廣泛應用於醫療診斷、設備故障排除等領域", "以人工撰寫的規則與知識庫為主", "知識需人工維護，難以擴展"], "a": [1, 2, 3], "e": "專家系統屬規則驅動，依賴專家知識轉成規則；自動從資料學習是機器學習的特色。", "ref": "Elements of AI（University of Helsinki & MinnaLearn）"}, {"id": "Q006", "s": 1, "n": 2, "t": "主題1", "sub": "1.1", "sn": "人工智慧概論與演進", "q": "AI 發展史上曾出現「AI 寒冬」，其主要原因包括哪些？", "o": ["外界期望過高，實際成果未達預期", "當時 AI 技術已全面成熟、不再需要研究", "當時運算能力與資料量不足", "網際網路過度普及"], "a": [0, 2], "e": "AI 寒冬源於期望落差、技術條件不足與經費縮減；與網路普及無關。AI 寒冬正是因技術尚未成熟、成果不如預期。", "ref": "Elements of AI（University of Helsinki & MinnaLearn）"}, {"id": "Q007", "s": 2, "n": 2, "t": "主題1", "sub": "1.1", "sn": "人工智慧概論與演進", "q": "2012 年前後深度學習在影像辨識取得突破，促成的條件包括哪些？", "o": ["神經網路訓練方法的改進", "量子電腦的普及", "GPU 提供的平行運算能力", "大量可用的標記資料"], "a": [0, 2, 3], "e": "大數據、GPU 算力與演算法改良共同推動深度學習崛起；量子電腦並非成因。", "ref": "生成式人工智慧與機器學習導論 2025（李宏毅）；Elements of AI（University of Helsinki & MinnaLearn）"}, {"id": "Q008", "s": 3, "n": 2, "t": "主題1", "sub": "1.1", "sn": "人工智慧概論與演進", "q": "2017 年提出的 Transformer 架構，下列哪些敘述正確？", "o": ["成為今日大型語言模型的共同基礎", "以注意力機制（Attention）為核心", "只能用於影像處理，無法處理文字", "由 OpenAI 於 2022 年首次提出"], "a": [0, 1], "e": "Transformer 以注意力機制處理序列資料，是 GPT 等 LLM 的基礎架構。Transformer 由 Google 研究團隊於 2017 年提出。", "ref": "生成式人工智慧與機器學習導論 2025（李宏毅）；Intro to Large Language Models (LLMs)（Codecademy）"}, {"id": "Q009", "s": 4, "n": 2, "t": "主題1", "sub": "1.1", "sn": "人工智慧概論與演進", "q": "機器學習常見的學習類型包括哪些？", "o": ["強化學習", "非監督式學習", "監督式學習", "人工規則式學習"], "a": [0, 1, 2], "e": "監督式、非監督式、強化學習是三大類型；人工撰寫規則屬傳統專家系統做法。", "ref": "Elements of AI（University of Helsinki & MinnaLearn）；Generative AI for Everyone（Andrew Ng／DeepLearning.AI）"}, {"id": "Q010", "s": 5, "n": 2, "t": "主題1", "sub": "1.1", "sn": "人工智慧概論與演進", "q": "下列哪些任務適合以「監督式學習」處理？", "o": ["在沒有任何標記的情況下，將客戶自動分成數群", "依標記好的瑕疵照片判斷產品良否", "依歷史成交資料預測房價", "依已標記的郵件資料判斷是否為垃圾郵件"], "a": [1, 2, 3], "e": "監督式學習需要已知答案（標記）的資料；無標記分群屬非監督式學習。", "ref": "Generative AI for Everyone（Andrew Ng／DeepLearning.AI）；Elements of AI（University of Helsinki & MinnaLearn）"}, {"id": "Q011", "s": 1, "n": 3, "t": "主題1", "sub": "1.1", "sn": "人工智慧概論與演進", "q": "關於「弱 AI／專用 AI（Narrow AI）」，下列哪些正確？", "o": ["已能完全取代人類所有工作", "現今實際應用的 AI 多屬此類", "專精於特定任務", "具備自我意識與情感"], "a": [1, 2], "e": "現有 AI 均為專用 AI，在特定任務表現出色，但不具通用智慧。弱 AI 不具自我意識與情感。", "ref": "Elements of AI（University of Helsinki & MinnaLearn）"}, {"id": "Q012", "s": 2, "n": 3, "t": "主題1", "sub": "1.1", "sn": "人工智慧概論與演進", "q": "關於「通用人工智慧（AGI）／強 AI」，下列哪些正確？", "o": ["市售智慧音箱已達到 AGI 水準", "又常被稱為強 AI", "目前仍屬研究目標", "指能像人一樣處理各種不同任務的 AI"], "a": [1, 2, 3], "e": "AGI 仍是研究目標；智慧音箱等產品屬專用 AI。", "ref": "Elements of AI（University of Helsinki & MinnaLearn）"}, {"id": "Q013", "s": 3, "n": 3, "t": "主題1", "sub": "1.1", "sn": "人工智慧概論與演進", "q": "關於判別式 AI 與生成式 AI，下列哪些正確？", "o": ["判別式 AI 擅長分類、預測、偵測", "生成式 AI 能產生新的文字、圖像等內容", "判斷一封信是否為詐騙信屬判別式任務", "撰寫一封回覆信屬生成式任務"], "a": [0, 1, 2, 3], "e": "判別式 AI 回答「是什麼／會怎樣」，生成式 AI 產生新內容；四個敘述皆正確。", "ref": "Generative AI for Everyone（Andrew Ng／DeepLearning.AI）；Google AI Essentials（Google）"}, {"id": "Q014", "s": 4, "n": 3, "t": "主題1", "sub": "1.1", "sn": "人工智慧概論與演進", "q": "Elements of AI 課程指出 AI 的兩項關鍵特性為何？", "o": ["必須由人類逐步下達每個指令才能運作", "永遠不會出錯", "自主性（Autonomy）", "適應性（Adaptivity），能從經驗中改進"], "a": [2, 3], "e": "Elements of AI 以自主性與適應性描述 AI 的關鍵特徵。", "ref": "Elements of AI（University of Helsinki & MinnaLearn）"}, {"id": "Q015", "s": 5, "n": 3, "t": "主題1", "sub": "1.1", "sn": "人工智慧概論與演進", "q": "下列哪些是 AI 在製造業的常見應用？", "o": ["讓工廠完全不需要任何人員", "產線排程最佳化", "瑕疵影像檢測", "設備預測保養"], "a": [1, 2, 3], "e": "AI 協助檢測、保養與排程，但仍需人員監督與決策。", "ref": "Google AI Essentials（Google）；Generative AI for Everyone（Andrew Ng／DeepLearning.AI）"}, {"id": "Q016", "s": 1, "n": 4, "t": "主題1", "sub": "1.1", "sn": "人工智慧概論與演進", "q": "下列哪些是 AI 在金融業的常見應用？", "o": ["完全取代法規遵循的人工審查", "詐騙交易偵測", "保證投資一定獲利", "信用評分"], "a": [1, 3], "e": "AI 可提升風控與服務效率，但無法保證投資報酬。法遵審查仍需人工負責。", "ref": "Google AI Essentials（Google）；Generative AI for Everyone（Andrew Ng／DeepLearning.AI）"}, {"id": "Q017", "s": 2, "n": 4, "t": "主題1", "sub": "1.1", "sn": "人工智慧概論與演進", "q": "AI 在醫療領域的應用，下列哪些敘述恰當？", "o": ["醫學影像輔助判讀", "協助新藥研發", "病歷與文獻摘要", "取代醫師承擔最終診斷責任"], "a": [0, 1, 2], "e": "AI 是醫療的輔助工具，最終診斷與責任仍在醫師。", "ref": "Google AI Essentials（Google）；【好好用 AI 素養計劃】負責任使用 AI（台灣人工智慧學校）"}, {"id": "Q018", "s": 3, "n": 4, "t": "主題1", "sub": "1.1", "sn": "人工智慧概論與演進", "q": "下列哪些是 AI 在零售電商的常見應用？", "o": ["商品文案生成", "需求預測", "完全消除庫存風險", "個人化商品推薦"], "a": [0, 1, 3], "e": "推薦、預測與文案生成是典型應用；預測仍有誤差，無法消除所有風險。", "ref": "Google AI Essentials（Google）；Generative AI for Everyone（Andrew Ng／DeepLearning.AI）"}, {"id": "Q019", "s": 4, "n": 4, "t": "主題1", "sub": "1.1", "sn": "人工智慧概論與演進", "q": "依《行政院及所屬機關（構）使用生成式 AI 參考指引》，下列哪些屬於公部門可運用生成式 AI 輔助的工作？", "o": ["一般公開資訊的文件摘要", "民眾常見問題的回覆草稿", "機密文書的撰寫", "業務資料分析的決策參考"], "a": [0, 1, 3], "e": "指引規定製作機密文書應由業務承辦人親自撰寫，禁止使用生成式 AI。", "ref": "行政院及所屬機關（構）使用生成式 AI 參考指引（行政院）"}, {"id": "Q020", "s": 5, "n": 4, "t": "主題1", "sub": "1.1", "sn": "人工智慧概論與演進", "q": "AI 在教育領域的應用，下列哪些敘述恰當？", "o": ["個人化學習建議", "AI 助教回答課程問題", "以 AI 評分作為學位授予的唯一依據", "出題與批改的輔助"], "a": [0, 1, 3], "e": "AI 可輔助教學，但涉及學生權益的評量需由教師最終判斷。", "ref": "【好好用 AI 素養計劃】負責任使用 AI（台灣人工智慧學校）；Google AI Essentials（Google）"}, {"id": "Q021", "s": 1, "n": 5, "t": "主題1", "sub": "1.1", "sn": "人工智慧概論與演進", "q": "AI 系統與傳統「寫死規則」的程式相比，下列哪些敘述正確？", "o": ["AI 系統的表現可能隨訓練資料不同而改變", "傳統程式依人工撰寫的明確規則運作", "AI 系統從資料中學習模式", "AI 系統的每個判斷都一定能被完整解釋"], "a": [0, 1, 2], "e": "AI 從資料學習，表現受資料影響；深度學習模型常難以完整解釋。", "ref": "人工智慧基本法（全國法規資料庫）；Elements of AI（University of Helsinki & MinnaLearn）"}, {"id": "Q022", "s": 2, "n": 5, "t": "主題1", "sub": "1.1", "sn": "人工智慧概論與演進", "q": "下列哪一個最能描述 AI 技術的演進主軸？", "o": ["AI Agent → 生成式 AI → 機器學習 → 規則驅動", "深度學習 → 規則驅動 → AI Agent → 機器學習", "規則驅動 → 資料驅動（機器學習）→ 深度學習 → 生成式 AI → AI Agent", "生成式 AI → 深度學習 → 規則驅動 → 機器學習"], "a": [2], "e": "AI 由人工規則走向從資料學習，再到深度學習、生成式 AI 與能執行任務的 AI Agent。", "ref": "生成式人工智慧與機器學習導論 2025（李宏毅）；Elements of AI（University of Helsinki & MinnaLearn）"}, {"id": "Q023", "s": 3, "n": 5, "t": "主題1", "sub": "1.1", "sn": "人工智慧概論與演進", "q": "關於 2022 年 11 月推出的 ChatGPT，下列哪些敘述正確？", "o": ["帶動職場廣泛使用生成式 AI", "是世界上第一個 AI 系統", "以對話介面讓一般大眾普遍接觸生成式 AI", "推出後各國立即全面禁止使用"], "a": [0, 2], "e": "ChatGPT 是生成式 AI 普及的轉折點，但 AI 研究早在 1950 年代就已開始。ChatGPT 推出後並未遭各國全面禁止。", "ref": "Generative AI for Everyone（Andrew Ng／DeepLearning.AI）；生成式人工智慧與機器學習導論 2025（李宏毅）"}, {"id": "Q024", "s": 4, "n": 5, "t": "主題1", "sub": "1.1", "sn": "人工智慧概論與演進", "q": "關於 AI Agent（AI 代理），下列哪些敘述正確？", "o": ["只能回答單一問題，無法採取行動", "執行任何動作都不需要權限設定", "能自行規劃完成任務的步驟", "能呼叫工具或外部系統"], "a": [2, 3], "e": "AI Agent 能規劃、使用工具並採取行動，因此權限管理更加重要。Agent 能採取行動，更需要權限控管。", "ref": "生成式人工智慧與機器學習導論 2025（李宏毅）；OWASP GenAI LLM Top 10 2026（OWASP GenAI Security Project）"}, {"id": "Q025", "s": 5, "n": 5, "t": "主題1", "sub": "1.1", "sn": "人工智慧概論與演進", "q": "下列哪些屬於 AI 從資料中學習的例子？", "o": ["語音助理依大量語音資料提升辨識率", "推薦系統依使用者瀏覽紀錄調整推薦內容", "垃圾郵件過濾器依使用者回報改進判斷", "影像辨識系統依大量標記照片提升準確率"], "a": [0, 1, 2, 3], "e": "四項都是 AI 從資料中學習、改進表現的例子。", "ref": "Elements of AI（University of Helsinki & MinnaLearn）；Google AI Essentials（Google）"}, {"id": "Q026", "s": 1, "n": 6, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "關於大型語言模型（LLM）的定義，下列哪些正確？", "o": ["能理解與生成自然語言", "以海量文字資料訓練", "參數規模龐大", "只能進行數學運算"], "a": [0, 1, 2], "e": "LLM 透過大量文字訓練，參數動輒數十億以上，能處理自然語言任務。", "ref": "Intro to Large Language Models (LLMs)（Codecademy）；生成式人工智慧與機器學習導論 2025（李宏毅）"}, {"id": "Q027", "s": 2, "n": 6, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "關於 LLM 生成文字的方式，下列哪些正確？", "o": ["帶有隨機性，同一問題可能得到不同答案", "依機率逐步生成回答", "先在資料庫找到正確答案後再原文回覆", "根據前文預測下一個 token"], "a": [0, 1, 3], "e": "LLM 像「文字接龍」，依機率逐一產生 token，並非查資料庫取答案。", "ref": "生成式人工智慧與機器學習導論 2025（李宏毅）；Intro to Large Language Models (LLMs)（Codecademy）"}, {"id": "Q028", "s": 3, "n": 6, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "關於 token，下列哪些正確？", "o": ["一個 token 永遠恰好等於一個中文字", "上下文長度上限以 token 數計算", "token 數量與輸入文字長度無關", "是模型處理文字的基本單位"], "a": [1, 3], "e": "token 可能是字、詞或字的一部分，切分方式依模型而定。輸入越長，token 數通常越多。", "ref": "Intro to Large Language Models (LLMs)（Codecademy）"}, {"id": "Q029", "s": 4, "n": 6, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "關於「上下文視窗（Context Window）」，下列哪些正確？", "o": ["與模型的知識截止日是同一件事", "長文件可透過分段或摘要處理", "對話超過上限時，模型可能遺忘較早內容", "指模型一次可處理的內容長度上限"], "a": [1, 2, 3], "e": "上下文視窗是單次處理長度；知識截止日是訓練資料的時間終點，兩者不同。", "ref": "Intro to Large Language Models (LLMs)（Codecademy）；生成式人工智慧與機器學習導論 2025（李宏毅）"}, {"id": "Q030", "s": 5, "n": 6, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "關於生成參數「溫度（Temperature）」，下列哪些正確？", "o": ["溫度較低，輸出較穩定一致", "溫度較高，輸出較多樣、有創意", "指模型運算時伺服器硬體的溫度", "溫度越高，內容的事實正確性一定越高"], "a": [0, 1], "e": "溫度控制生成的隨機程度，與硬體溫度無關。溫度只影響隨機程度，不代表更正確。", "ref": "Intro to Large Language Models (LLMs)（Codecademy）；Prompt Engineering: Overview and Guide（Google Cloud）"}, {"id": "Q031", "s": 1, "n": 7, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "關於生成式 AI 的「幻覺（Hallucination）」，下列哪些正確？", "o": ["可能捏造不存在的引用文獻", "只要使用付費版本就不會發生", "重要內容需人工查證", "生成看似合理但錯誤或捏造的內容"], "a": [0, 2, 3], "e": "幻覺是 LLM 的本質限制，任何版本都可能發生，需查證。", "ref": "Generative AI for Everyone（Andrew Ng／DeepLearning.AI）；生成式人工智慧與機器學習導論 2025（李宏毅）"}, {"id": "Q032", "s": 2, "n": 7, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "造成 LLM 產生幻覺的原因可能包括哪些？", "o": ["提示中缺乏可依據的資料", "模型依機率生成文字，而非查證事實", "訓練資料有缺漏或錯誤", "使用者打字速度太快"], "a": [0, 1, 2], "e": "幻覺來自生成機制、資料品質與缺乏依據，與打字速度無關。", "ref": "生成式人工智慧與機器學習導論 2025（李宏毅）；Prompt Engineering Overview（Anthropic）"}, {"id": "Q033", "s": 3, "n": 7, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "關於 LLM 的「知識截止日」，下列哪些正確？", "o": ["模型不會自動知道之後發生的事件", "截止日之後的事件，模型都能準確回答", "模型每次對話都會自動更新知識", "指訓練資料的時間終點"], "a": [0, 3], "e": "模型知識凍結於訓練時，需靠搜尋或使用者提供資料取得新資訊。截止日之後的事件模型並不知道。", "ref": "Generative AI for Everyone（Andrew Ng／DeepLearning.AI）；Intro to Large Language Models (LLMs)（Codecademy）"}, {"id": "Q034", "s": 4, "n": 7, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "關於 LLM 的「預訓練（Pre-training）」，下列哪些正確？", "o": ["需要大量的資料與運算資源", "產生可再調整的基礎模型", "以大量文字學習語言規律與知識", "大致決定模型的知識範圍"], "a": [0, 1, 2, 3], "e": "四項皆正確；預訓練以自督導學習處理海量文字，需大量算力。", "ref": "生成式人工智慧與機器學習導論 2025（李宏毅）"}, {"id": "Q035", "s": 5, "n": 7, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "關於「指令微調（SFT）」，下列哪些正確？", "o": ["使用人類撰寫的「問題－好答案」範例", "讓模型學會聽懂並遵循指令", "在預訓練之前進行", "屬於監督式學習"], "a": [0, 1, 3], "e": "LLM 訓練順序為預訓練 → 指令微調 → 人類回饋強化學習。", "ref": "生成式人工智慧與機器學習導論 2025（李宏毅）"}, {"id": "Q036", "s": 1, "n": 8, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "關於 RLHF，下列哪些正確？", "o": ["全名為人類回饋強化學習", "讓模型更有幫助、更安全", "由人類評比模型答案的好壞", "主要目的是增加模型參數數量"], "a": [0, 1, 2], "e": "RLHF 依人類偏好調整模型行為，使其更符合人類價值，而非增加參數。", "ref": "生成式人工智慧與機器學習導論 2025（李宏毅）；Generative AI for Everyone（Andrew Ng／DeepLearning.AI）"}, {"id": "Q037", "s": 2, "n": 8, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "關於「基礎模型（Foundation Model）」，下列哪些正確？", "o": ["以大量資料預訓練而成", "大型語言模型屬於基礎模型", "可再調整以適用多種任務", "只能用於單一特定任務"], "a": [0, 1, 2], "e": "基礎模型的特色是通用性，可延伸到多種下游任務。", "ref": "生成式人工智慧與機器學習導論 2025（李宏毅）；Google AI Essentials（Google）"}, {"id": "Q038", "s": 3, "n": 8, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "GPT 的全名為何？", "o": ["Generative Pre-trained Transformer", "Graphic Processing Tool", "Global Prediction Transformer", "General Purpose Technology"], "a": [0], "e": "GPT 三個字分別代表生成、預訓練與 Transformer 架構。", "ref": "生成式人工智慧與機器學習導論 2025（李宏毅）；Intro to Large Language Models (LLMs)（Codecademy）"}, {"id": "Q039", "s": 4, "n": 8, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "下列哪一個是大型語言模型發展的正確時間順序？", "o": ["ChatGPT（2022）→ Transformer（2017）→ GPT-3（2020）", "GPT-3（2020）→ ChatGPT（2022）→ Transformer（2017）", "Transformer（2017）→ ChatGPT（2022）→ GPT-3（2020）", "Transformer（2017）→ GPT-3（2020）→ ChatGPT（2022）"], "a": [3], "e": "Transformer 於 2017 年提出，GPT-3 於 2020 年發表，ChatGPT 於 2022 年推出。", "ref": "生成式人工智慧與機器學習導論 2025（李宏毅）；Intro to Large Language Models (LLMs)（Codecademy）"}, {"id": "Q040", "s": 5, "n": 8, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "關於 GPT-3，下列哪些正確？", "o": ["約 1,750 億個參數", "原生具備影片生成能力", "於 2010 年發表", "展現少樣本學習（few-shot）能力"], "a": [0, 3], "e": "GPT-3 以龐大參數展現少樣本學習能力，屬文字模型。GPT-3 於 2020 年發表。", "ref": "生成式人工智慧與機器學習導論 2025（李宏毅）；Intro to Large Language Models (LLMs)（Codecademy）"}, {"id": "Q041", "s": 1, "n": 9, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "關於推理模型（Reasoning Model），下列哪些正確？", "o": ["回答前會先產生思考步驟", "適合數學、程式與多步驟問題", "回應速度一定比一般模型快且更便宜", "保證不會出現幻覺"], "a": [0, 1], "e": "推理模型花更多運算思考，通常較慢、成本較高，且仍可能出錯。推理模型仍可能出錯。", "ref": "生成式人工智慧與機器學習導論 2025（李宏毅）"}, {"id": "Q042", "s": 2, "n": 9, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "關於開放權重（Open-weight）模型，下列哪些正確？", "o": ["適合在地端處理敏感資料", "OpenAI 的 GPT-4 屬此類", "可下載後自行部署", "執行時完全不需要運算資源"], "a": [0, 2], "e": "開放權重模型可地端部署，但仍需相應的運算硬體。GPT-4 為封閉模型；Meta 的 Llama 才是開放權重的例子。", "ref": "生成式人工智慧與機器學習導論 2025（李宏毅）；Google AI Essentials（Google）"}, {"id": "Q043", "s": 3, "n": 9, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "關於封閉商用模型服務，下列哪些正確？", "o": ["多透過網頁介面或 API 使用", "輸入的資料會傳送到服務商的雲端", "使用者可自由下載模型權重", "OpenAI GPT、Google Gemini、Anthropic Claude 屬此類"], "a": [0, 1, 3], "e": "封閉商用模型不開放權重，使用時資料會傳到雲端，需注意資料安全。", "ref": "Google AI Essentials（Google）；Generative AI for Everyone（Andrew Ng／DeepLearning.AI）"}, {"id": "Q044", "s": 4, "n": 9, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "關於 Google 的 Gemini 模型，下列哪些正確？", "o": ["支援長上下文", "原生多模態設計", "由 Meta 開發", "與 Google Workspace 等服務整合"], "a": [0, 1, 3], "e": "Gemini 由 Google 開發，主打多模態與長上下文。", "ref": "Google AI Essentials（Google）"}, {"id": "Q045", "s": 5, "n": 9, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "關於 TAIDE 模型，下列哪些正確？", "o": ["以開放權重形式釋出", "由 OpenAI 開發", "強化繁體中文與台灣在地知識", "由國科會推動"], "a": [0, 2, 3], "e": "TAIDE 是國科會推動的可信任生成式 AI 計畫，提供在地化的開放模型。", "ref": "生成式人工智慧與機器學習導論 2025（李宏毅）"}, {"id": "Q046", "s": 1, "n": 10, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "組織選用生成式 AI 模型時，應考量哪些因素？", "o": ["資料敏感度（雲端或地端）", "任務類型與所需能力", "操作介面的配色", "使用成本"], "a": [0, 1, 3], "e": "選用應依任務、資料安全、成本與組織政策評估。", "ref": "Generative AI for Everyone（Andrew Ng／DeepLearning.AI）；Build Effective Generative AI Solutions in Your Organization（Microsoft Learn）"}, {"id": "Q047", "s": 2, "n": 10, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "下列哪些屬於影像生成工具或模型？", "o": ["Excel 樞紐分析表", "Stable Diffusion", "Microsoft Outlook", "Midjourney"], "a": [1, 3], "e": "Midjourney、Stable Diffusion、DALL·E 皆可依文字生成圖像。Outlook 是郵件軟體。", "ref": "Google AI Essentials（Google）"}, {"id": "Q048", "s": 3, "n": 10, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "下列哪些屬於影片生成模型或工具？", "o": ["Runway", "Microsoft Word", "Sora", "Veo"], "a": [0, 2, 3], "e": "Sora（OpenAI）、Veo（Google）、Runway 都能生成影片；Word 是文書軟體。", "ref": "Google AI Essentials（Google）"}, {"id": "Q049", "s": 4, "n": 10, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "依 Generative AI for Everyone 課程，生成式 AI 擅長的任務類型包括哪些？", "o": ["對話（如客服聊天）", "保證提供最新且正確的即時資訊", "閱讀（如摘要、擷取資訊）", "寫作（如草擬、改寫）"], "a": [0, 2, 3], "e": "課程將常見應用歸納為寫作、閱讀與對話三類，並提醒其限制。", "ref": "Generative AI for Everyone（Andrew Ng／DeepLearning.AI）"}, {"id": "Q050", "s": 5, "n": 10, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "下列哪些是 LLM 的常見限制？", "o": ["可能產生幻覺", "上下文長度有限", "有知識截止日", "可能帶有偏見"], "a": [0, 1, 2, 3], "e": "知識截止、幻覺、上下文限制與偏見都是 LLM 的已知限制。", "ref": "Generative AI for Everyone（Andrew Ng／DeepLearning.AI）"}, {"id": "Q051", "s": 1, "n": 11, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "Transformer 中「注意力機制」的主要作用為何？", "o": ["讓模型判斷輸入中各字詞之間的關聯與重要程度", "調整生成溫度", "將資料加密以保護隱私", "壓縮影片檔案大小"], "a": [0], "e": "注意力機制讓模型在處理每個字時，能關注上下文中相關的部分。", "ref": "生成式人工智慧與機器學習導論 2025（李宏毅）"}, {"id": "Q052", "s": 2, "n": 11, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "關於「少樣本學習（Few-shot）」，下列哪些正確？", "o": ["在提示中提供少量範例即可引導模型完成任務", "範例越多越好，至少要提供上千個", "與零樣本（Zero-shot）提示相對", "必須重新訓練模型才能使用"], "a": [0, 2], "e": "少樣本學習是在提示中給範例，不需重新訓練。少樣本只需少量範例。", "ref": "生成式人工智慧與機器學習導論 2025（李宏毅）；Prompt Engineering: Overview and Guide（Google Cloud）"}, {"id": "Q053", "s": 3, "n": 11, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "關於模型的「參數」，下列哪些正確？", "o": ["是模型在訓練中學到的數值", "參數越多，回答一定越正確", "LLM 的參數數量常以億、兆計", "影響模型能力與運算成本"], "a": [0, 2, 3], "e": "參數多通常能力較強，但不保證正確，仍可能出錯。", "ref": "生成式人工智慧與機器學習導論 2025（李宏毅）；Intro to Large Language Models (LLMs)（Codecademy）"}, {"id": "Q054", "s": 4, "n": 11, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "關於「自督導學習」，下列哪些正確？", "o": ["讓模型能利用大量未標記的文字", "是 LLM 預訓練常用的方式", "由資料本身產生學習目標，例如預測下一個字", "需要大量人工逐筆標註"], "a": [0, 1, 2], "e": "自督導學習不需人工標註，是 LLM 能用海量文字訓練的關鍵。", "ref": "生成式人工智慧與機器學習導論 2025（李宏毅）"}, {"id": "Q055", "s": 5, "n": 11, "t": "主題1", "sub": "1.2", "sn": "生成式 AI 與 LLM 基礎", "q": "以「文字接龍」理解語言模型時，可推論出哪些現象？", "o": ["輸出是逐步產生的", "提示內容會影響後續輸出", "模型輸出都經過事實查證，保證正確", "模型可能前後說法矛盾"], "a": [0, 1, 3], "e": "語言模型依前文生成後文，沒有內建事實查證機制。", "ref": "生成式人工智慧與機器學習導論 2025（李宏毅）"}, {"id": "Q056", "s": 1, "n": 12, "t": "主題1", "sub": "1.3", "sn": "多模態 AI 概念", "q": "關於「多模態（Multimodal）」，下列哪些正確？", "o": ["單一模態模型只處理一種形式的資料", "多模態 AI 能處理兩種以上的模態", "模態指資訊的形式，如文字、影像、聲音、影片", "結合語音與文字互動的助理屬於多模態應用"], "a": [0, 1, 2, 3], "e": "四項敘述皆正確；模態指資訊形式，多模態能處理多種形式。", "ref": "Google AI Essentials（Google）；生成式人工智慧與機器學習導論 2025（李宏毅）"}, {"id": "Q057", "s": 2, "n": 12, "t": "主題1", "sub": "1.3", "sn": "多模態 AI 概念", "q": "關於「文生圖」技術，下列哪些正確？", "o": ["只能生成黑白圖片", "可用於海報與插圖製作", "產出的圖像必定沒有任何著作權疑慮", "依文字描述產生圖像"], "a": [1, 3], "e": "文生圖是跨模態生成；產出仍可能涉及著作權或肖像權問題。文生圖可生成各種色彩與風格的圖像。", "ref": "Google AI Essentials（Google）；【好好用 AI 素養計劃】負責任使用 AI（台灣人工智慧學校）"}, {"id": "Q058", "s": 3, "n": 12, "t": "主題1", "sub": "1.3", "sn": "多模態 AI 概念", "q": "下列哪些屬於「影像理解」的應用？", "o": ["解讀圖表趨勢", "讀取發票與表格內容（OCR）", "生成背景音樂", "看圖並描述內容"], "a": [0, 1, 3], "e": "影像理解是由圖到文；生成音樂屬音訊生成。", "ref": "Google AI Essentials（Google）"}, {"id": "Q059", "s": 4, "n": 12, "t": "主題1", "sub": "1.3", "sn": "多模態 AI 概念", "q": "下列哪些屬於「語音轉文字」的應用？", "o": ["會議逐字稿", "將講稿轉成合成語音旁白", "影片字幕", "依文字描述生成圖片"], "a": [0, 2], "e": "語音辨識將聲音轉成文字。講稿轉旁白屬於文字轉語音。", "ref": "Google AI Essentials（Google）"}, {"id": "Q060", "s": 5, "n": 12, "t": "主題1", "sub": "1.3", "sn": "多模態 AI 概念", "q": "下列哪些屬於「文字轉語音」的應用？", "o": ["影片旁白配音", "掃描紙本文件存檔", "無障礙朗讀服務", "會議錄音轉成逐字稿"], "a": [0, 2], "e": "語音合成將文字轉為聲音；掃描文件屬影像處理。錄音轉逐字稿屬於語音轉文字。", "ref": "Google AI Essentials（Google）"}, {"id": "Q061", "s": 1, "n": 13, "t": "主題1", "sub": "1.3", "sn": "多模態 AI 概念", "q": "多模態 AI 能對影片進行哪些處理？", "o": ["產生影片逐字稿", "找出特定片段", "摘要影片重點", "自動修改相關法規"], "a": [0, 1, 2], "e": "影片理解可做摘要、檢索與轉寫。", "ref": "Google AI Essentials（Google）；生成式人工智慧與機器學習導論 2025（李宏毅）"}, {"id": "Q062", "s": 2, "n": 13, "t": "主題1", "sub": "1.3", "sn": "多模態 AI 概念", "q": "關於多模態 AI 的運作概念，下列哪些正確？", "o": ["多模態模型只能接受圖片輸入", "將不同媒體轉換成模型可處理的表示（如向量、token）", "在同一模型中共同理解不同模態", "不同模態只能各用獨立模型且完全無法互通"], "a": [1, 2], "e": "多模態模型把各種媒體轉成統一表示，因此能跨模態理解與轉換。多模態模型可處理文字、圖片、聲音等多種輸入。", "ref": "生成式人工智慧與機器學習導論 2025（李宏毅）"}, {"id": "Q063", "s": 3, "n": 13, "t": "主題1", "sub": "1.3", "sn": "多模態 AI 概念", "q": "「會議錄音 → 逐字稿 → 摘要 → 待辦清單」的流程，運用了哪些 AI 能力？", "o": ["文字摘要", "圖像生成", "語音辨識", "文字生成"], "a": [0, 2, 3], "e": "此流程由語音轉文字，再進行摘要與待辦生成，未涉及圖像生成。", "ref": "Google AI Essentials（Google）；7 Ways to Use AI at Work（Google）"}, {"id": "Q064", "s": 4, "n": 13, "t": "主題1", "sub": "1.3", "sn": "多模態 AI 概念", "q": "將紙本表單拍照後轉成 Excel 統計，下列哪些是合適的技術或做法？", "o": ["語音合成", "人工抽查辨識結果", "影像辨識（OCR）", "要求以固定欄位的結構化格式輸出"], "a": [1, 2, 3], "e": "需要影像辨識與結構化輸出，並抽查錯誤；語音合成無關。", "ref": "Google AI Essentials（Google）；Prompt Engineering（OpenAI）"}, {"id": "Q065", "s": 5, "n": 13, "t": "主題1", "sub": "1.3", "sn": "多模態 AI 概念", "q": "運用多模態 AI 製作行銷短影音時，下列哪些做法恰當？", "o": ["以 AI 生成海報與插圖", "使用素材時無須確認授權", "剪輯成短影音並人工檢查", "以 AI 產生旁白配音"], "a": [0, 2, 3], "e": "使用 AI 製作素材仍需確認著作權與授權。", "ref": "Google AI Essentials（Google）；【好好用 AI 素養計劃】負責任使用 AI（台灣人工智慧學校）"}, {"id": "Q066", "s": 1, "n": 14, "t": "主題1", "sub": "1.3", "sn": "多模態 AI 概念", "q": "使用數位人製作教學影片時，應注意哪些事項？", "o": ["人工審核內容正確性", "標示內容為 AI 生成", "可模仿真實名人而不需取得同意", "取得肖像與聲音的授權"], "a": [0, 1, 3], "e": "模仿真人需取得同意並揭露，以避免侵權與誤導。", "ref": "Responsible Practices for Synthetic Media（Partnership on AI）；【好好用 AI 素養計劃】負責任使用 AI（台灣人工智慧學校）"}, {"id": "Q067", "s": 2, "n": 14, "t": "主題1", "sub": "1.3", "sn": "多模態 AI 概念", "q": "多模態生成技術可能帶來哪些風險？", "o": ["圖像中的隱私資訊外洩", "著作權爭議", "完全沒有任何風險", "深度偽造（Deepfake）"], "a": [0, 1, 3], "e": "多模態生成能力越強，深度偽造與侵權風險越需重視。", "ref": "Responsible Practices for Synthetic Media（Partnership on AI）；Content Credentials（C2PA）；【好好用 AI 素養計劃】負責任使用 AI（台灣人工智慧學校）"}, {"id": "Q068", "s": 3, "n": 14, "t": "主題1", "sub": "1.3", "sn": "多模態 AI 概念", "q": "上傳圖片給生成式 AI 分析前，應注意哪些事項？", "o": ["確認圖片中沒有臉部、證件等個人資料", "移除機密內容", "任何圖片都可直接上傳公開服務", "確認符合組織的使用政策"], "a": [0, 1, 3], "e": "圖片同樣可能含個資與機密，上傳前需檢查。", "ref": "行政院及所屬機關（構）使用生成式 AI 參考指引（行政院）；【好好用 AI 素養計劃】負責任使用 AI（台灣人工智慧學校）"}, {"id": "Q069", "s": 4, "n": 14, "t": "主題1", "sub": "1.3", "sn": "多模態 AI 概念", "q": "請 AI 解讀一張營收圖表時，下列哪些敘述恰當？", "o": ["AI 可協助指出異常點", "AI 讀出的數值一定精確，不需核對", "AI 可將圖表轉成文字說明", "AI 可協助描述趨勢"], "a": [0, 2, 3], "e": "影像辨識仍可能讀錯數值，重要數字需核對原始資料。", "ref": "Google AI Essentials（Google）"}, {"id": "Q070", "s": 5, "n": 14, "t": "主題1", "sub": "1.3", "sn": "多模態 AI 概念", "q": "下列哪些屬於多模態的輸入方式？", "o": ["只輸入純文字問題", "上傳含圖表的 PDF 並提問", "上傳照片並以文字提問", "以語音與 AI 對話"], "a": [1, 2, 3], "e": "同時使用文字以外的媒體輸入才屬多模態。", "ref": "Google AI Essentials（Google）"}, {"id": "Q071", "s": 1, "n": 15, "t": "主題1", "sub": "1.3", "sn": "多模態 AI 概念", "q": "拍攝白板筆記請 AI 整理時，下列哪些正確？", "o": ["需檢查是否有辨識錯誤", "可要求整理成條列重點", "屬於語音合成技術", "屬於由影像轉成文字的處理"], "a": [0, 1, 3], "e": "白板整理是影像理解；仍需檢查錯字與漏字。", "ref": "Google AI Essentials（Google）"}, {"id": "Q072", "s": 2, "n": 15, "t": "主題1", "sub": "1.3", "sn": "多模態 AI 概念", "q": "多模態技術在職場跨媒體應用的價值，下列哪些正確？", "o": ["每次轉換仍需人工檢查", "可完全取代設計師與編輯的工作", "提升製作效率", "一份內容可快速轉成多種形式"], "a": [0, 2, 3], "e": "AI 加速跨媒體轉換，但品質把關仍需專業人員。", "ref": "Google AI Essentials（Google）；Generative AI for Everyone（Andrew Ng／DeepLearning.AI）"}, {"id": "Q073", "s": 3, "n": 15, "t": "主題1", "sub": "1.3", "sn": "多模態 AI 概念", "q": "下列哪些任務涉及兩種以上的模態？", "o": ["即時語音翻譯成文字字幕（音→文）", "依文字腳本生成影片（文→影）", "看圖說故事（圖→文）", "將中文文章翻譯成英文文章"], "a": [0, 1, 2], "e": "文字翻譯成文字只涉及單一模態。", "ref": "Google AI Essentials（Google）；生成式人工智慧與機器學習導論 2025（李宏毅）"}, {"id": "Q074", "s": 4, "n": 15, "t": "主題1", "sub": "1.3", "sn": "多模態 AI 概念", "q": "運用多模態 AI 建置客服服務時，下列哪些做法恰當？", "o": ["由 AI 依照片初步判斷可能問題", "讓使用者上傳產品照片描述故障", "保留轉接真人的管道", "提供語音客服"], "a": [0, 1, 2, 3], "e": "多模態可提升客服體驗，同時應保留轉真人管道處理複雜情況。", "ref": "Google AI Essentials（Google）；Build Effective Generative AI Solutions in Your Organization（Microsoft Learn）"}, {"id": "Q075", "s": 5, "n": 15, "t": "主題1", "sub": "1.3", "sn": "多模態 AI 概念", "q": "標示 AI 生成內容的方式包括哪些？", "o": ["刪除所有檔案中繼資料", "文字註記「本內容由 AI 協助生成」", "使用 C2PA 內容憑證", "加上浮水印"], "a": [1, 2, 3], "e": "揭露與內容憑證有助透明；刪除中繼資料反而移除來源資訊。", "ref": "Content Credentials（C2PA）；Responsible Practices for Synthetic Media（Partnership on AI）"}, {"id": "Q076", "s": 1, "n": 16, "t": "主題2", "sub": "2.1", "sn": "提示詞工程", "q": "撰寫有效提示詞時，常見的組成要素包括哪些？", "o": ["角色", "任務", "上下文", "輸出格式"], "a": [0, 1, 2, 3], "e": "角色、任務、上下文、格式（再加上範例與限制）是撰寫好提示的常用要素。", "ref": "Prompt Engineering: Overview and Guide（Google Cloud）；Prompt Engineering（OpenAI）；Prompt Engineering Overview（Anthropic）"}, {"id": "Q077", "s": 2, "n": 16, "t": "主題2", "sub": "2.1", "sn": "提示詞工程", "q": "依各家官方提示詞指南，「清楚直接」的提示具有哪些特徵？", "o": ["避免說明讀者是誰，讓 AI 自行猜測", "使用明確的動詞說明任務", "說明目的與讀者對象", "越短越模糊越好，AI 會自行發揮"], "a": [1, 2], "e": "模糊的提示容易得到空泛結果；清楚說明任務、對象與長度效果較好。說明讀者對象有助於產生合適的內容。", "ref": "Prompt Engineering（OpenAI）；Prompt Engineering Overview（Anthropic）"}, {"id": "Q078", "s": 3, "n": 16, "t": "主題2", "sub": "2.1", "sn": "提示詞工程", "q": "關於「少樣本提示（Few-shot Prompting）」，下列哪些正確？", "o": ["必須提供 100 個以上的範例才有效", "在提示中提供 1 至數個範例", "讓輸出更符合期望的風格與格式", "提供範例後，模型就保證不會出錯"], "a": [1, 2], "e": "少量範例即可有效引導輸出格式與風格。範例能引導格式，但不保證正確。", "ref": "Prompt Engineering: Overview and Guide（Google Cloud）；Prompt Engineering Overview（Anthropic）"}, {"id": "Q079", "s": 4, "n": 16, "t": "主題2", "sub": "2.1", "sn": "提示詞工程", "q": "關於「零樣本提示（Zero-shot Prompting）」，下列哪些正確？", "o": ["使用前必須先微調模型", "必須同時提供至少三個範例", "與少樣本提示相對", "不提供範例，直接下達指令"], "a": [2, 3], "e": "零樣本提示直接描述任務，不需範例或微調。提供範例屬於少樣本提示。", "ref": "Prompt Engineering: Overview and Guide（Google Cloud）"}, {"id": "Q080", "s": 5, "n": 16, "t": "主題2", "sub": "2.1", "sn": "提示詞工程", "q": "關於「思路鏈（Chain-of-Thought）」或請模型逐步思考，下列哪些正確？", "o": ["適用於所有任務，且能把正確率提高到百分之百", "有助於處理多步驟推理問題", "一定會讓所有任務的回應速度變快", "請模型先列出推理步驟再作答"], "a": [1, 3], "e": "逐步思考可提升推理品質，但會產生較多輸出，未必較快。逐步思考有幫助，但不保證完全正確。", "ref": "Prompt Engineering: Overview and Guide（Google Cloud）；Prompt Engineering（OpenAI）；Prompt Engineering Overview（Anthropic）"}, {"id": "Q081", "s": 1, "n": 17, "t": "主題2", "sub": "2.1", "sn": "提示詞工程", "q": "在提示中設定角色（如「你是資深人資專員」）的作用，下列哪些正確？", "o": ["Anthropic 指南稱為角色提示（role prompting）", "讓回答的專業視角與語氣更貼近需求", "設定角色後，AI 的回答就不需要再查證", "設定角色等於授權 AI 存取公司內部系統"], "a": [0, 1], "e": "角色設定能調整觀點與語氣，但不會讓內容自動變正確。角色設定只影響回答視角，不涉及系統權限。", "ref": "Prompt Engineering Overview（Anthropic）"}, {"id": "Q082", "s": 2, "n": 17, "t": "主題2", "sub": "2.1", "sn": "提示詞工程", "q": "在提示中區隔「指令」與「參考資料」的做法，下列哪些恰當？", "o": ["把指令與資料混在同一段不加區隔", "用分隔符號（如 ###）分段", "用引號標示參考內容", "用 XML 標籤（如 <document>）包住資料"], "a": [1, 2, 3], "e": "OpenAI 建議使用分隔符號，Anthropic 建議使用 XML 標籤區分結構。", "ref": "Prompt Engineering（OpenAI）；Prompt Engineering Overview（Anthropic）"}, {"id": "Q083", "s": 3, "n": 17, "t": "主題2", "sub": "2.1", "sn": "提示詞工程", "q": "在提示中提供參考文字（reference text），有哪些好處或注意事項？", "o": ["參考文字可以放入任何機密資料，不需考量", "有助降低捏造內容", "可要求模型只依參考內容回答", "提供參考文字後，模型就保證不會產生幻覺"], "a": [1, 2], "e": "提供參考資料能讓回答有依據，但仍須遵守資料保密規範。參考文字能降低但無法消除幻覺。", "ref": "Prompt Engineering（OpenAI）；行政院及所屬機關（構）使用生成式 AI 參考指引（行政院）"}, {"id": "Q084", "s": 4, "n": 17, "t": "主題2", "sub": "2.1", "sn": "提示詞工程", "q": "面對複雜任務時，「拆解任務」的做法包括哪些？", "o": ["拆解任務通常會降低輸出品質", "一次要求模型完成全部內容效果最好", "以多個提示串接完成（提示鏈）", "先產生大綱，再分段撰寫，最後整體潤飾"], "a": [2, 3], "e": "將複雜任務拆成較簡單的子任務，可降低錯誤率。拆解任務通常能提升品質。", "ref": "Prompt Engineering（OpenAI）；Prompt Engineering Overview（Anthropic）"}, {"id": "Q085", "s": 5, "n": 17, "t": "主題2", "sub": "2.1", "sn": "提示詞工程", "q": "在提示中可以指定哪些輸出格式？", "o": ["JSON", "表格", "字數限制", "條列重點"], "a": [0, 1, 2, 3], "e": "明確指定格式能讓結果更容易直接使用。", "ref": "Prompt Engineering: Overview and Guide（Google Cloud）；Prompt Engineering（OpenAI）"}, {"id": "Q086", "s": 1, "n": 18, "t": "主題2", "sub": "2.1", "sn": "提示詞工程", "q": "下列哪些是在提示中加入「限制條件」的恰當例子？", "o": ["不必寫任何限制，AI 會自動遵守組織規範", "限制越多越好，不必考慮彼此是否矛盾", "不要虛構講者姓名", "資訊不確定時請直接說明"], "a": [2, 3], "e": "適當的限制可降低幻覺並符合需求；矛盾的限制會讓結果變差。AI 不會自動知道組織規範，需在提示中說明。", "ref": "Prompt Engineering（OpenAI）；Prompt Engineering Overview（Anthropic）"}, {"id": "Q087", "s": 2, "n": 18, "t": "主題2", "sub": "2.1", "sn": "提示詞工程", "q": "關於提示詞的「迭代優化」，下列哪些做法恰當？", "o": ["以追問方式修正結果", "第一版結果不理想就放棄使用 AI", "把有效的提示存成範本", "檢視輸出與需求之間的落差"], "a": [0, 2, 3], "e": "好結果往往需要多次調整；保存範本可累積經驗。", "ref": "Google AI Essentials（Google）；Prompt Engineering（OpenAI）"}, {"id": "Q088", "s": 3, "n": 18, "t": "主題2", "sub": "2.1", "sn": "提示詞工程", "q": "下列哪些屬於修正 AI 輸出的追問指令？", "o": ["請重新開機", "請再精簡一半", "請改成表格呈現", "語氣請更正式"], "a": [1, 2, 3], "e": "追問能針對長度、格式、語氣逐步調整結果。", "ref": "Google AI Essentials（Google）；7 Ways to Use AI at Work（Google）"}, {"id": "Q089", "s": 4, "n": 18, "t": "主題2", "sub": "2.1", "sn": "提示詞工程", "q": "在提示中加入「資訊不足時請先問我問題」，有哪些效果？", "o": ["適合需求尚不明確的任務", "可減少模型自行臆測", "有助釐清需求", "會導致資料外洩"], "a": [0, 1, 2], "e": "請 AI 反問可補足缺漏資訊，提升回答品質。", "ref": "Prompt Engineering Overview（Anthropic）；Google AI Essentials（Google）"}, {"id": "Q090", "s": 5, "n": 18, "t": "主題2", "sub": "2.1", "sn": "提示詞工程", "q": "OpenAI 建議「系統性測試」提示的改變，下列哪些正確？", "o": ["以多個測試案例檢驗修改是否真的改善", "建立評估標準", "重要應用尤其應這樣做", "只憑單次結果的印象判斷即可"], "a": [0, 1, 2], "e": "單一結果可能有偶然性，需用一組案例評估提示是否改善。", "ref": "Prompt Engineering（OpenAI）"}, {"id": "Q091", "s": 1, "n": 19, "t": "主題2", "sub": "2.1", "sn": "提示詞工程", "q": "RAG 的中文全名為何？", "o": ["強化學習生成", "檢索增強生成", "隨機注意力生成", "遞迴對抗生成"], "a": [1], "e": "RAG 即 Retrieval-Augmented Generation，檢索增強生成。", "ref": "Introduction to Retrieval-Augmented Generation Concepts（Microsoft Learn）"}, {"id": "Q092", "s": 2, "n": 19, "t": "主題2", "sub": "2.1", "sn": "提示詞工程", "q": "RAG 的運作流程包括哪些步驟？", "o": ["依據這些內容生成回答", "每次提問前重新訓練模型", "從資料來源檢索相關內容", "刪除使用者的提問內容"], "a": [0, 2], "e": "RAG 不需重新訓練模型，而是在回答時帶入檢索到的資料。RAG 是將檢索內容與提問一起交給模型。", "ref": "Introduction to Retrieval-Augmented Generation Concepts（Microsoft Learn）"}, {"id": "Q093", "s": 3, "n": 19, "t": "主題2", "sub": "2.1", "sn": "提示詞工程", "q": "使用 RAG 的好處包括哪些？", "o": ["有助降低幻覺", "能使用組織內部或最新的資料", "不需重新訓練模型", "回答可附上資料來源"], "a": [0, 1, 2, 3], "e": "RAG 讓模型以檢索內容為依據回答，兼顧時效與可追溯性。", "ref": "Introduction to Retrieval-Augmented Generation Concepts（Microsoft Learn）"}, {"id": "Q094", "s": 4, "n": 19, "t": "主題2", "sub": "2.1", "sn": "提示詞工程", "q": "關於 RAG 的限制或注意事項，下列哪些正確？", "o": ["使用 RAG 後回答保證百分之百正確", "檢索不到相關資料時仍可能出錯", "資料來源品質會影響回答品質", "RAG 不需要任何資料來源"], "a": [1, 2], "e": "RAG 能降低但無法消除錯誤，並需注意權限與資料品質。RAG 必須有可檢索的資料來源。", "ref": "Introduction to Retrieval-Augmented Generation Concepts（Microsoft Learn）；OWASP GenAI LLM Top 10 2026（OWASP GenAI Security Project）"}, {"id": "Q095", "s": 5, "n": 19, "t": "主題2", "sub": "2.1", "sn": "提示詞工程", "q": "一般使用者也能運用「簡易版 RAG」的概念，下列哪些做法屬之？", "o": ["上傳文件後針對文件提問", "不提供任何資料，只問模型記得什麼", "要求依文件回答並引用段落", "在提示中貼上參考資料"], "a": [0, 2, 3], "e": "提供資料並要求依資料回答，就是 RAG 的核心精神。", "ref": "Introduction to Retrieval-Augmented Generation Concepts（Microsoft Learn）；Prompt Engineering（OpenAI）"}, {"id": "Q096", "s": 1, "n": 20, "t": "主題2", "sub": "2.1", "sn": "提示詞工程", "q": "Microsoft Learn 說明 RAG 以檢索內容作為回答依據（grounding），下列哪些正確？", "o": ["不等同於重新訓練或微調模型", "讓回答建立在檢索到的資料之上", "grounding 指的是把伺服器接地", "減少模型憑空生成"], "a": [0, 1, 3], "e": "grounding 指以可信資料作為生成依據。", "ref": "Introduction to Retrieval-Augmented Generation Concepts（Microsoft Learn）"}, {"id": "Q097", "s": 2, "n": 20, "t": "主題2", "sub": "2.1", "sn": "提示詞工程", "q": "下列哪些情境適合使用 RAG？", "o": ["企業內部規章問答", "自由創作一首詩", "依產品手冊回答客戶問題", "隨意閒聊天氣與心情"], "a": [0, 2], "e": "需要依據特定或最新資料回答時適合 RAG；自由創作不需檢索。閒聊不需檢索特定資料。", "ref": "Introduction to Retrieval-Augmented Generation Concepts（Microsoft Learn）"}, {"id": "Q098", "s": 3, "n": 20, "t": "主題2", "sub": "2.1", "sn": "提示詞工程", "q": "提示「幫我寫一封活動通知信」缺少了哪些資訊，容易導致結果空泛？", "o": ["活動目的", "收件對象", "輸出格式與字數", "活動時間地點"], "a": [0, 1, 2, 3], "e": "缺乏對象、目的、格式與關鍵資訊，AI 只能產生泛用內容。", "ref": "Prompt Engineering（OpenAI）；7 Ways to Use AI at Work（Google）"}, {"id": "Q099", "s": 4, "n": 20, "t": "主題2", "sub": "2.1", "sn": "提示詞工程", "q": "Google Cloud 的提示詞工程指南介紹了哪些提示類型？", "o": ["思路鏈提示", "零樣本提示", "少樣本提示", "反向傳播提示"], "a": [0, 1, 2], "e": "反向傳播是神經網路的訓練演算法，不是提示類型。", "ref": "Prompt Engineering: Overview and Guide（Google Cloud）"}, {"id": "Q100", "s": 5, "n": 20, "t": "主題2", "sub": "2.1", "sn": "提示詞工程", "q": "Anthropic 的提示詞工程指南建議的技巧包括哪些？", "o": ["使用範例", "用 XML 標籤組織提示結構", "讓模型逐步思考", "清楚直接地描述任務"], "a": [0, 1, 2, 3], "e": "四項皆為 Anthropic 指南中的建議技巧。", "ref": "Prompt Engineering Overview（Anthropic）"}, {"id": "Q101", "s": 1, "n": 21, "t": "主題2", "sub": "2.2", "sn": "職場任務中的常見應用", "q": "在一般行政工作中，下列哪些文件適合請 AI 協助起草初稿？", "o": ["含個資的學生輔導紀錄（直接輸入公開服務）", "工作報告大綱", "機關的機密文書", "活動公告"], "a": [1, 3], "e": "一般文件可用 AI 起草；機密文書依行政院指引應由承辦人親自撰寫。含個資的紀錄不應直接輸入公開服務。", "ref": "行政院及所屬機關（構）使用生成式 AI 參考指引（行政院）；7 Ways to Use AI at Work（Google）"}, {"id": "Q102", "s": 2, "n": 21, "t": "主題2", "sub": "2.2", "sn": "職場任務中的常見應用", "q": "運用 AI 處理電子郵件時，下列哪些做法恰當？", "o": ["草擬回覆內容", "讓 AI 不經檢查直接寄出重要信件", "摘要冗長的郵件往來", "調整回覆信的語氣"], "a": [0, 2, 3], "e": "AI 可加速郵件處理，但重要信件寄出前應由人確認。", "ref": "7 Ways to Use AI at Work（Google）；Google AI Essentials（Google）"}, {"id": "Q103", "s": 3, "n": 21, "t": "主題2", "sub": "2.2", "sn": "職場任務中的常見應用", "q": "請 AI 協助校稿與改寫時，AI 可以幫忙哪些工作？", "o": ["精簡冗句", "調整語氣", "自動確保內容事實完全正確", "找出錯字"], "a": [0, 1, 3], "e": "校稿改善文字品質，但事實正確性仍需自行查證。", "ref": "Google AI Essentials（Google）；Prompt Engineering（OpenAI）"}, {"id": "Q104", "s": 4, "n": 21, "t": "主題2", "sub": "2.2", "sn": "職場任務中的常見應用", "q": "使用 AI 翻譯文件時，下列哪些做法恰當？", "o": ["合約譯文直接簽署，不需專人確認", "中英文互譯初稿", "認定 AI 翻譯一定零錯誤", "專業術語由人工確認"], "a": [1, 3], "e": "AI 翻譯可能誤譯專業術語或語意，正式文件需審核。正式合約需專人或法務審核。", "ref": "Google AI Essentials（Google）"}, {"id": "Q105", "s": 5, "n": 21, "t": "主題2", "sub": "2.2", "sn": "職場任務中的常見應用", "q": "運用 AI 製作會議紀錄時，可以產出哪些內容？", "o": ["自動判定與會者的績效考核分數", "自動判定誰在會議中說錯話並予以懲處", "將逐字稿整理成會議紀錄", "整理待辦事項、負責人與期限"], "a": [2, 3], "e": "AI 擅長整理紀錄與待辦；績效考核屬於人的判斷。懲處屬於人的權責判斷。", "ref": "7 Ways to Use AI at Work（Google）；Google AI Essentials（Google）"}, {"id": "Q106", "s": 1, "n": 22, "t": "主題2", "sub": "2.2", "sn": "職場任務中的常見應用", "q": "將會議錄音上傳 AI 服務前，應注意哪些事項？", "o": ["可任意上傳到任何公開工具", "事先告知與會者並取得同意", "確認符合組織政策", "注意錄音中的個資與機密"], "a": [1, 2, 3], "e": "錄音可能含個資與機密，需取得同意並使用核准工具。", "ref": "行政院及所屬機關（構）使用生成式 AI 參考指引（行政院）；【好好用 AI 素養計劃】負責任使用 AI（台灣人工智慧學校）"}, {"id": "Q107", "s": 2, "n": 22, "t": "主題2", "sub": "2.2", "sn": "職場任務中的常見應用", "q": "請 AI 製作摘要時，下列哪些做法能提升品質？", "o": ["說明摘要的讀者", "要求列出重點", "認定摘要必然完整、不會遺漏", "指定摘要長度"], "a": [0, 1, 3], "e": "摘要可能遺漏重點，提供讀者與長度要求並檢查原文較可靠。", "ref": "Prompt Engineering（OpenAI）；7 Ways to Use AI at Work（Google）"}, {"id": "Q108", "s": 3, "n": 22, "t": "主題2", "sub": "2.2", "sn": "職場任務中的常見應用", "q": "運用 AI 進行數據分析時，下列哪些做法恰當？", "o": ["計算統計數值", "AI 算出的數字不需要核對", "整理與清理資料表", "撰寫圖表說明文字"], "a": [0, 2, 3], "e": "AI 可加速分析，但計算結果與解讀仍需核對。", "ref": "Google AI Essentials（Google）；7 Ways to Use AI at Work（Google）"}, {"id": "Q109", "s": 4, "n": 22, "t": "主題2", "sub": "2.2", "sn": "職場任務中的常見應用", "q": "使用 AI 生成報告時，下列哪些做法恰當？", "o": ["直接以 AI 初稿作為最終報告提交，不需審閱", "標註資料來源", "人工核對數據", "依資料產生報告初稿"], "a": [1, 2, 3], "e": "AI 報告是初稿，需人工審閱與核對才能提交。", "ref": "7 Ways to Use AI at Work（Google）；Generative AI for Everyone（Andrew Ng／DeepLearning.AI）"}, {"id": "Q110", "s": 5, "n": 22, "t": "主題2", "sub": "2.2", "sn": "職場任務中的常見應用", "q": "請 AI 協助排列任務優先順序時，下列哪些做法恰當？", "o": ["將大型專案拆解成小任務", "完全交由 AI 決定，不需與團隊討論", "依重要／緊急四象限分類", "依截止期限排序"], "a": [0, 2, 3], "e": "AI 能提供排序建議，最終優先順序應由人與團隊決定。", "ref": "Google AI Essentials（Google）；7 Ways to Use AI at Work（Google）"}, {"id": "Q111", "s": 1, "n": 23, "t": "主題2", "sub": "2.2", "sn": "職場任務中的常見應用", "q": "運用 AI 管理行程時，可協助哪些工作？", "o": ["規劃每週行程", "自動替你回絕所有主管的會議", "自動接受所有會議邀請", "設定重要提醒時間點"], "a": [0, 3], "e": "AI 可協助規劃與提醒，接受邀請等決定仍應由本人確認。會議邀約的決定應由本人確認。", "ref": "Google AI Essentials（Google）"}, {"id": "Q112", "s": 2, "n": 23, "t": "主題2", "sub": "2.2", "sn": "職場任務中的常見應用", "q": "請 AI 整理提醒事項與待辦清單時，下列哪些做法恰當？", "o": ["不需確認日期是否正確", "結合行事曆工具", "列出各項截止日期", "建立待辦清單"], "a": [1, 2, 3], "e": "AI 可能誤判日期，需確認後再設定提醒。", "ref": "Google AI Essentials（Google）"}, {"id": "Q113", "s": 3, "n": 23, "t": "主題2", "sub": "2.2", "sn": "職場任務中的常見應用", "q": "運用 AI 進行腦力激盪時，下列哪些做法恰當？", "o": ["列出各方案的利弊", "提出多個不同方案", "請 AI 從不同角色觀點提出想法", "發想活動名稱"], "a": [0, 1, 2, 3], "e": "四項皆是有效的腦力激盪做法。", "ref": "7 Ways to Use AI at Work（Google）；Google AI Essentials（Google）"}, {"id": "Q114", "s": 4, "n": 23, "t": "主題2", "sub": "2.2", "sn": "職場任務中的常見應用", "q": "使用 AI 產出工作文件後，檢查清單應包含哪些項目？", "o": ["字型是否足夠花俏", "事實與數字是否正確", "語氣是否符合對象", "是否含敏感資料"], "a": [1, 2, 3], "e": "正確性、敏感資料與語氣是交付前的重點檢查項目。", "ref": "行政院及所屬機關（構）使用生成式 AI 參考指引（行政院）；Prompt Engineering（OpenAI）"}, {"id": "Q115", "s": 5, "n": 23, "t": "主題2", "sub": "2.2", "sn": "職場任務中的常見應用", "q": "請 AI 協助回覆客戶抱怨信時，提示中宜包含哪些內容？", "o": ["字數限制", "去識別化後的原信內容", "客戶的身分證號與完整聯絡資料", "指定「同理但堅定」的語氣"], "a": [0, 1, 3], "e": "提供必要脈絡即可，個資應去識別化。", "ref": "Prompt Engineering（OpenAI）；行政院及所屬機關（構）使用生成式 AI 參考指引（行政院）"}, {"id": "Q116", "s": 1, "n": 24, "t": "主題2", "sub": "2.2", "sn": "職場任務中的常見應用", "q": "生成式 AI 在職場上常見的協助類型包括哪些？", "o": ["摘要", "規劃", "寫作", "腦力激盪"], "a": [0, 1, 2, 3], "e": "寫作、摘要、發想與規劃都是職場常見的生成式 AI 應用。", "ref": "7 Ways to Use AI at Work（Google）；Google AI Essentials（Google）"}, {"id": "Q117", "s": 2, "n": 24, "t": "主題2", "sub": "2.2", "sn": "職場任務中的常見應用", "q": "請 AI 協助處理試算表時，下列哪些做法恰當？", "o": ["請 AI 撰寫公式", "請 AI 建議資料清理方式", "請 AI 解釋公式錯誤的原因", "相信 AI 寫的公式一定正確，不需測試"], "a": [0, 1, 2], "e": "AI 寫的公式仍需以實際資料測試驗證。", "ref": "Google AI Essentials（Google）；7 Ways to Use AI at Work（Google）"}, {"id": "Q118", "s": 3, "n": 24, "t": "主題2", "sub": "2.3", "sn": "生成式 AI 的進階使用", "q": "下列哪些屬於生成式 AI 的「數據提取」應用？", "o": ["將問卷開放題的回答分類", "擷取後不需抽查原文", "從合約中擷取日期與金額", "自動修改合約條款並代為簽署"], "a": [0, 2], "e": "數據提取可能漏抓或誤植，需抽查原文比對。修改與簽署合約不屬數據提取，且需權責人員處理。", "ref": "Build Effective Generative AI Solutions in Your Organization（Microsoft Learn）；Prompt Engineering（OpenAI）"}, {"id": "Q119", "s": 4, "n": 24, "t": "主題2", "sub": "2.3", "sn": "生成式 AI 的進階使用", "q": "請 AI 摘要大量文件時，下列哪些做法恰當？", "o": ["分段處理", "指定要擷取的欄位", "一次貼入遠超過上下文長度的內容也無妨", "要求標註出處"], "a": [0, 1, 3], "e": "超出上下文長度可能導致遺漏，應分段並要求引用。", "ref": "Prompt Engineering（OpenAI）；Intro to Large Language Models (LLMs)（Codecademy）"}, {"id": "Q120", "s": 5, "n": 24, "t": "主題2", "sub": "2.3", "sn": "生成式 AI 的進階使用", "q": "要求 AI 以「結構化輸出」回答，有哪些形式或好處？", "o": ["方便匯入 Excel 或其他系統", "以固定欄位的表格輸出", "只能以自然段落文字輸出", "以 JSON 格式輸出"], "a": [0, 1, 3], "e": "結構化輸出便於後續處理與自動化。", "ref": "Prompt Engineering（OpenAI）；Build Effective Generative AI Solutions in Your Organization（Microsoft Learn）"}, {"id": "Q121", "s": 1, "n": 25, "t": "主題2", "sub": "2.3", "sn": "生成式 AI 的進階使用", "q": "運用 AI「生成洞見與建議」時，下列哪些做法恰當？", "o": ["提出數個改善方案", "把 AI 的建議直接當成最終決策", "比較各方案優缺點", "分析滿意度調查找出主要問題"], "a": [0, 2, 3], "e": "AI 提供選項與分析，決策仍由人負責。", "ref": "Generative AI for Everyone（Andrew Ng／DeepLearning.AI）；Build Effective Generative AI Solutions in Your Organization（Microsoft Learn）"}, {"id": "Q122", "s": 2, "n": 25, "t": "主題2", "sub": "2.3", "sn": "生成式 AI 的進階使用", "q": "判斷 AI 提出之洞見是否可信時，應注意哪些事項？", "o": ["確認推論有資料支持", "與其他來源交叉比對", "結論寫得漂亮就可採用", "留意可能的偏見"], "a": [0, 1, 3], "e": "洞見需要證據支持，並注意資料與模型偏見。", "ref": "What is AI Ethics?（IBM）；Generative AI for Everyone（Andrew Ng／DeepLearning.AI）"}, {"id": "Q123", "s": 3, "n": 25, "t": "主題2", "sub": "2.3", "sn": "生成式 AI 的進階使用", "q": "下列哪些屬於可用 AI 協助「自動化」的例行任務？", "o": ["表單回覆的分類與通知寄送", "郵件自動分類", "每週報表彙整", "重大人事決定的全自動處理"], "a": [0, 1, 2], "e": "例行、低風險任務適合自動化；人事決定涉及權益需人判斷。", "ref": "Build Effective Generative AI Solutions in Your Organization（Microsoft Learn）；人工智慧基本法（全國法規資料庫）"}, {"id": "Q124", "s": 4, "n": 25, "t": "主題2", "sub": "2.3", "sn": "生成式 AI 的進階使用", "q": "下列哪些是常用來串接流程、實現自動化的工具？", "o": ["Windows 記事本", "Microsoft Power Automate", "n8n", "Adobe Photoshop"], "a": [1, 2], "e": "Power Automate、n8n、Zapier 都是流程自動化平台。Photoshop 是影像編輯軟體。", "ref": "Build Effective Generative AI Solutions in Your Organization（Microsoft Learn）"}, {"id": "Q125", "s": 5, "n": 25, "t": "主題2", "sub": "2.3", "sn": "生成式 AI 的進階使用", "q": "導入 AI 自動化流程時，應遵守哪些原則？", "o": ["保留執行紀錄", "先小範圍試行", "一次全面上線以節省時間", "保留人工審核關卡"], "a": [0, 1, 3], "e": "自動化錯誤會被大量複製，宜逐步導入並保留審核。", "ref": "Build Effective Generative AI Solutions in Your Organization（Microsoft Learn）；OWASP GenAI LLM Top 10 2026（OWASP GenAI Security Project）"}, {"id": "Q126", "s": 1, "n": 26, "t": "主題2", "sub": "2.3", "sn": "生成式 AI 的進階使用", "q": "Generative AI for Everyone 建議分析 AI 機會的方式，下列哪些正確？", "o": ["考量技術可行性與商業價值", "評估哪些任務可由 AI 輔助或自動化", "以整個職位為單位直接由 AI 取代", "把工作拆解成一項項任務"], "a": [0, 1, 3], "e": "課程建議以「任務」而非「職位」為單位分析 AI 的影響。", "ref": "Generative AI for Everyone（Andrew Ng／DeepLearning.AI）"}, {"id": "Q127", "s": 2, "n": 26, "t": "主題2", "sub": "2.3", "sn": "生成式 AI 的進階使用", "q": "關於 AI Agent 的進階應用，下列哪些正確？", "o": ["權限需要嚴格控管", "能自行規劃步驟", "能呼叫工具完成任務", "因為能自主執行，所以不會出錯"], "a": [0, 1, 2], "e": "Agent 能採取行動，錯誤代價更高，需最小權限與人工確認。", "ref": "OWASP GenAI LLM Top 10 2026（OWASP GenAI Security Project）；Build Effective Generative AI Solutions in Your Organization（Microsoft Learn）"}, {"id": "Q128", "s": 3, "n": 26, "t": "主題2", "sub": "2.3", "sn": "生成式 AI 的進階使用", "q": "進階使用生成式 AI 時，可能面臨哪些風險？", "o": ["錯誤被大量複製", "完全沒有風險", "AI Agent 權限過大（過度代理）", "資料外洩"], "a": [0, 2, 3], "e": "自動化與 Agent 放大效率，也放大錯誤與資安風險。", "ref": "OWASP GenAI LLM Top 10 2026（OWASP GenAI Security Project）"}, {"id": "Q129", "s": 4, "n": 26, "t": "主題2", "sub": "2.3", "sn": "生成式 AI 的進階使用", "q": "使用 AI 分析大量顧客評論時，下列哪些做法恰當？", "o": ["抽樣人工驗證分類結果", "將評論分類為正面或負面", "找出常見主題", "分析結果直接公開評論者的姓名"], "a": [0, 1, 2], "e": "情緒與主題分析可快速掌握意見，但需保護評論者隱私。", "ref": "Prompt Engineering（OpenAI）；行政院及所屬機關（構）使用生成式 AI 參考指引（行政院）"}, {"id": "Q130", "s": 5, "n": 26, "t": "主題2", "sub": "2.3", "sn": "生成式 AI 的進階使用", "q": "請 AI 進行比較分析時，提示中宜包含哪些內容？", "o": ["指定比較的維度", "要求說明判斷依據", "要求以表格呈現", "不提供任何資料，讓 AI 自由發揮"], "a": [0, 1, 2], "e": "提供資料、維度與依據要求，才能得到可檢驗的比較結果。", "ref": "Prompt Engineering（OpenAI）；Prompt Engineering Overview（Anthropic）"}, {"id": "Q131", "s": 1, "n": 27, "t": "主題2", "sub": "2.3", "sn": "生成式 AI 的進階使用", "q": "評估某項任務是否適合以 AI 自動化時，應考量哪些因素？", "o": ["結果是否容易驗證", "所需資料是否可取得並能合法使用", "任務發生的頻率", "出錯的成本"], "a": [0, 1, 2, 3], "e": "四項皆是評估自動化適合度的重要因素。", "ref": "Build Effective Generative AI Solutions in Your Organization（Microsoft Learn）；Generative AI for Everyone（Andrew Ng／DeepLearning.AI）"}, {"id": "Q132", "s": 2, "n": 27, "t": "主題2", "sub": "2.3", "sn": "生成式 AI 的進階使用", "q": "需要從含個資的文件中擷取資料時，下列哪些做法恰當？", "o": ["遵守個人資料保護法", "使用任何免費公開服務即可", "使用組織核准的工具", "先進行去識別化"], "a": [0, 2, 3], "e": "處理個資需合法並使用安全工具。", "ref": "行政院及所屬機關（構）使用生成式 AI 參考指引（行政院）；生成式 AI 導入指引－企業應具備的 AI 素養（資策會）"}, {"id": "Q133", "s": 3, "n": 27, "t": "主題2", "sub": "2.3", "sn": "生成式 AI 的進階使用", "q": "依 Microsoft Learn 建置組織生成式 AI 解決方案的觀念，下列哪些正確？", "o": ["評估價值與風險", "先購買最貴的工具再找用途", "從明確的業務問題出發", "選擇合適的模型與工具"], "a": [0, 2, 3], "e": "以業務需求為出發點，評估價值與風險後再選工具。", "ref": "Build Effective Generative AI Solutions in Your Organization（Microsoft Learn）"}, {"id": "Q134", "s": 4, "n": 27, "t": "主題2", "sub": "2.4", "sn": "與現有工作流程整合", "q": "將 AI 融入現有流程時，下列哪一個步驟順序最恰當？", "o": ["標準化擴散 → 盤點流程 → 挑選任務 → 小規模試行", "盤點流程 → 挑選任務 → 小規模試行 → 標準化擴散", "小規模試行 → 標準化擴散 → 挑選任務 → 盤點流程", "挑選任務 → 標準化擴散 → 盤點流程 → 小規模試行"], "a": [1], "e": "先了解現況與機會，再試行驗證，最後標準化推廣。", "ref": "Build Effective Generative AI Solutions in Your Organization（Microsoft Learn）"}, {"id": "Q135", "s": 5, "n": 27, "t": "主題2", "sub": "2.4", "sn": "與現有工作流程整合", "q": "導入 AI 時，適合優先試行的任務具有哪些特性？", "o": ["結果容易驗證", "涉及重大個人權益", "風險較低", "發生頻率高"], "a": [0, 2, 3], "e": "低風險、高頻、易驗證的任務適合作為起點。", "ref": "Build Effective Generative AI Solutions in Your Organization（Microsoft Learn）；Generative AI for Everyone（Andrew Ng／DeepLearning.AI）"}, {"id": "Q136", "s": 1, "n": 28, "t": "主題2", "sub": "2.4", "sn": "與現有工作流程整合", "q": "在流程中，哪些步驟應保留由人執行或決定？", "o": ["出錯代價高的步驟", "涉及個人權益的步驟", "重複性的格式整理", "結果難以驗證的步驟"], "a": [0, 1, 3], "e": "格式整理適合交給 AI；高風險、難驗證、涉及權益者應由人負責。", "ref": "行政院及所屬機關（構）使用生成式 AI 參考指引（行政院）；人工智慧基本法（全國法規資料庫）"}, {"id": "Q137", "s": 2, "n": 28, "t": "主題2", "sub": "2.4", "sn": "與現有工作流程整合", "q": "AI 試行階段可採用哪些衡量指標？", "o": ["節省的時間", "錯誤率", "使用者滿意度", "產出品質的抽查結果"], "a": [0, 1, 2, 3], "e": "四項都是反映效益與品質的指標。", "ref": "Build Effective Generative AI Solutions in Your Organization（Microsoft Learn）"}, {"id": "Q138", "s": 3, "n": 28, "t": "主題2", "sub": "2.4", "sn": "與現有工作流程整合", "q": "將 AI 應用「標準化」以擴散到團隊，可採取哪些做法？", "o": ["讓每位同仁各自摸索、不必統一做法", "撰寫作業說明", "建立提示範本庫", "不需留下任何紀錄或文件"], "a": [1, 2], "e": "標準化讓經驗可被複製與傳承。標準化的目的正是統一做法、累積經驗。", "ref": "Build Effective Generative AI Solutions in Your Organization（Microsoft Learn）"}, {"id": "Q139", "s": 4, "n": 28, "t": "主題2", "sub": "2.4", "sn": "與現有工作流程整合", "q": "關於「人在迴路中（Human-in-the-loop）」，下列哪些正確？", "o": ["最適合完全不需人力的大量低風險分類", "AI 產出後由人審核確認才送出", "AI 完全自主執行，人不介入", "可降低錯誤造成的風險"], "a": [1, 3], "e": "人在迴路中強調關鍵步驟由人把關。大量低風險自動化較適合「人在迴路上」。", "ref": "Build Effective Generative AI Solutions in Your Organization（Microsoft Learn）；行政院及所屬機關（構）使用生成式 AI 參考指引（行政院）"}, {"id": "Q140", "s": 5, "n": 28, "t": "主題2", "sub": "2.4", "sn": "與現有工作流程整合", "q": "關於「人在迴路上（Human-on-the-loop）」，下列哪些正確？", "o": ["適合低風險的例行作業", "AI 自動執行", "人定期抽查與監控", "適合人事獎懲等重大決定"], "a": [0, 1, 2], "e": "人在迴路上適用低風險任務；重大決定應由人主導。", "ref": "Build Effective Generative AI Solutions in Your Organization（Microsoft Learn）"}, {"id": "Q141", "s": 1, "n": 29, "t": "主題2", "sub": "2.4", "sn": "與現有工作流程整合", "q": "在「人主導」模式下，下列哪些敘述正確？", "o": ["由人逐項做出決定", "適合人事、獎懲、對外正式文件", "適合垃圾郵件過濾這類大量例行工作", "AI 只提供草稿或建議"], "a": [0, 1, 3], "e": "人主導適用高風險事項；大量例行工作可交由 AI 自動處理。", "ref": "行政院及所屬機關（構）使用生成式 AI 參考指引（行政院）；人工智慧基本法（全國法規資料庫）"}, {"id": "Q142", "s": 2, "n": 29, "t": "主題2", "sub": "2.4", "sn": "與現有工作流程整合", "q": "避免過度依賴 AI 的做法包括哪些？", "o": ["保持自己的專業判斷", "持續培養自身能力", "重要內容一定查證", "把 AI 視為最終權威"], "a": [0, 1, 2], "e": "AI 是輔助工具，不是最終權威。", "ref": "行政院及所屬機關（構）使用生成式 AI 參考指引（行政院）；Generative AI for Everyone（Andrew Ng／DeepLearning.AI）"}, {"id": "Q143", "s": 3, "n": 29, "t": "主題2", "sub": "2.4", "sn": "與現有工作流程整合", "q": "關於使用 AI 的責任歸屬，下列哪些正確？", "o": ["使用 AI 的人應對成果負責", "AI 產生的錯誤由 AI 自行負責", "保留紀錄以便追溯", "單位應建立使用規範"], "a": [0, 2, 3], "e": "AI 不是責任主體，使用者與單位須負責。", "ref": "人工智慧基本法（全國法規資料庫）；Embrace Responsible AI Principles and Practices（Microsoft Learn）"}, {"id": "Q144", "s": 4, "n": 29, "t": "主題2", "sub": "2.4", "sn": "與現有工作流程整合", "q": "依《行政院及所屬機關（構）使用生成式 AI 參考指引》，下列哪些正確？", "o": ["使用生成式 AI 輔助應適當揭露", "使用者應對產出做客觀與專業的最終判斷", "不可完全信任生成式 AI 產出的資訊", "生成式 AI 可直接決定行政處分"], "a": [0, 1, 2], "e": "指引強調不可完全信任、需最終判斷並適當揭露。", "ref": "行政院及所屬機關（構）使用生成式 AI 參考指引（行政院）"}, {"id": "Q145", "s": 5, "n": 29, "t": "主題2", "sub": "2.4", "sn": "與現有工作流程整合", "q": "促進組織順利採用 AI 的策略包括哪些？", "o": ["訂定使用規範", "主管支持並以身作則", "禁止同仁討論 AI 使用經驗", "提供教育訓練"], "a": [0, 1, 3], "e": "領導、制度與訓練是採用成功的關鍵；交流有助推廣。", "ref": "Build Effective Generative AI Solutions in Your Organization（Microsoft Learn）；生成式 AI 導入指引－企業應具備的 AI 素養（資策會）"}, {"id": "Q146", "s": 1, "n": 30, "t": "主題2", "sub": "2.4", "sn": "與現有工作流程整合", "q": "各單位培養「AI 種子人員」的作用包括哪些？", "o": ["替全部同仁完成所有工作", "擔任單位內的 AI 推廣者", "就近協助同仁解決問題", "分享成功案例"], "a": [1, 2, 3], "e": "種子人員負責推廣與協助，而非代替同仁工作。", "ref": "Build Effective Generative AI Solutions in Your Organization（Microsoft Learn）"}, {"id": "Q147", "s": 2, "n": 30, "t": "主題2", "sub": "2.4", "sn": "與現有工作流程整合", "q": "化解同仁對導入 AI 的疑慮，下列哪些做法恰當？", "o": ["傾聽同仁意見並調整", "說明 AI 是輔助而非取代", "隱瞞導入計畫以避免反彈", "說明可把時間留給更有價值的工作"], "a": [0, 1, 3], "e": "透明溝通與參與能降低抗拒。", "ref": "Build Effective Generative AI Solutions in Your Organization（Microsoft Learn）；Generative AI for Everyone（Andrew Ng／DeepLearning.AI）"}, {"id": "Q148", "s": 3, "n": 30, "t": "主題2", "sub": "2.4", "sn": "與現有工作流程整合", "q": "組織的 AI 使用規範通常包含哪些內容？", "o": ["員工個人社群帳號的密碼", "產出審核流程", "可輸入資料的分級", "核准使用的工具清單"], "a": [1, 2, 3], "e": "規範應明確工具、資料與審核；不應蒐集個人帳密。", "ref": "行政院及所屬機關（構）使用生成式 AI 參考指引（行政院）；生成式 AI 導入指引－企業應具備的 AI 素養（資策會）"}, {"id": "Q149", "s": 4, "n": 30, "t": "主題2", "sub": "2.4", "sn": "與現有工作流程整合", "q": "組織導入 AI 失敗的常見原因包括哪些？", "o": ["缺乏使用規範", "缺乏教育訓練", "有明確的業務目標", "看不到具體成效"], "a": [0, 1, 3], "e": "明確的業務目標是成功因素，而非失敗原因。", "ref": "Build Effective Generative AI Solutions in Your Organization（Microsoft Learn）"}, {"id": "Q150", "s": 5, "n": 30, "t": "主題2", "sub": "2.4", "sn": "與現有工作流程整合", "q": "AI 導入後的「持續衡量」包括哪些做法？", "o": ["蒐集使用者回饋", "追蹤效益", "定期檢討與調整", "建立問題回報機制"], "a": [0, 1, 2, 3], "e": "四項皆屬持續衡量與改善的做法。", "ref": "Build Effective Generative AI Solutions in Your Organization（Microsoft Learn）"}, {"id": "Q151", "s": 1, "n": 31, "t": "主題3", "sub": "3.1", "sn": "數據隱私、安全和合規", "q": "下列哪些資料不應輸入公開的生成式 AI 服務？", "o": ["已公開發布的新聞稿", "尚未公開的財務資料", "身分證字號", "政府已公開的統計報告"], "a": [1, 2], "e": "個資與未公開機密不應輸入公開服務；已公開資訊風險較低。已公開的統計報告風險較低。", "ref": "行政院及所屬機關（構）使用生成式 AI 參考指引（行政院）；【好好用 AI 素養計劃】負責任使用 AI（台灣人工智慧學校）"}, {"id": "Q152", "s": 2, "n": 31, "t": "主題3", "sub": "3.1", "sn": "數據隱私、安全和合規", "q": "將資料輸入雲端生成式 AI 服務，可能帶來哪些風險？", "o": ["部分服務可能將對話用於改進模型", "資料存放於服務商伺服器", "不會有任何風險", "雲端服務保證永不發生資料外洩"], "a": [0, 1], "e": "雲端服務涉及資料存放、訓練使用與分享外流等風險。任何服務都無法保證永不外洩。", "ref": "【好好用 AI 素養計劃】負責任使用 AI（台灣人工智慧學校）；OWASP GenAI LLM Top 10 2026（OWASP GenAI Security Project）"}, {"id": "Q153", "s": 3, "n": 31, "t": "主題3", "sub": "3.1", "sn": "數據隱私、安全和合規", "q": "依《行政院及所屬機關（構）使用生成式 AI 參考指引》，下列哪些正確？", "o": ["可將公務機密交由生成式 AI 撰寫以提升效率", "製作機密文書應由業務承辦人親自撰寫，禁止使用生成式 AI", "不可完全信任生成式 AI 產出之資訊", "不得向生成式 AI 提供應保密、個人及未經機關同意公開之資訊"], "a": [1, 2, 3], "e": "指引明確禁止以生成式 AI 製作機密文書及輸入應保密資訊。", "ref": "行政院及所屬機關（構）使用生成式 AI 參考指引（行政院）"}, {"id": "Q154", "s": 4, "n": 31, "t": "主題3", "sub": "3.1", "sn": "數據隱私、安全和合規", "q": "依行政院生成式 AI 參考指引，下列哪些正確？", "o": ["生成式 AI 的產出可直接作為決策依據，不需檢核", "使用者不需對產出做最終判斷", "以生成式 AI 作為執行業務的輔助時，應適當揭露", "各機關可依使用情形訂定使用規範或內控措施"], "a": [2, 3], "e": "指引要求適當揭露並由使用者做專業最終判斷，機關可自訂規範。", "ref": "行政院及所屬機關（構）使用生成式 AI 參考指引（行政院）"}, {"id": "Q155", "s": 5, "n": 31, "t": "主題3", "sub": "3.1", "sn": "數據隱私、安全和合規", "q": "「去識別化」的做法包括哪些？", "o": ["只刪除姓名就保證無法識別個人", "以代號取代姓名", "遮蔽身分證號等識別資料", "保留完整學號以利日後核對"], "a": [1, 2], "e": "多項間接資訊組合仍可能識別個人，需一併處理。學號可識別個人，應一併處理。", "ref": "生成式 AI 導入指引－企業應具備的 AI 素養（資策會）；【好好用 AI 素養計劃】負責任使用 AI（台灣人工智慧學校）"}, {"id": "Q156", "s": 1, "n": 32, "t": "主題3", "sub": "3.1", "sn": "數據隱私、安全和合規", "q": "關於使用「組織核准的 AI 工具」，下列哪些正確？", "o": ["應符合組織的使用政策", "優先使用組織授權的企業版服務", "以私人免費帳號處理公務資料較方便，可優先使用", "使用核准工具後，任何機密都可輸入，不必再分級"], "a": [0, 1], "e": "公務資料應使用核准工具，私人帳號缺乏合約與管控保障。即使是核准工具，仍需依資料分級使用。", "ref": "生成式 AI 導入指引－企業應具備的 AI 素養（資策會）；行政院及所屬機關（構）使用生成式 AI 參考指引（行政院）"}, {"id": "Q157", "s": 2, "n": 32, "t": "主題3", "sub": "3.1", "sn": "數據隱私、安全和合規", "q": "保護 AI 服務帳號安全的做法包括哪些？", "o": ["把密碼寫在便利貼並貼在螢幕上", "啟用多因素驗證", "設定強密碼", "與同事共用同一帳號"], "a": [1, 2], "e": "共用帳號難以追蹤責任且增加外洩風險。這會讓密碼外洩。", "ref": "生成式 AI 導入指引－企業應具備的 AI 素養（資策會）"}, {"id": "Q158", "s": 3, "n": 32, "t": "主題3", "sub": "3.1", "sn": "數據隱私、安全和合規", "q": "使用生成式 AI 服務時，應檢查哪些隱私設定？", "o": ["對話紀錄的保存與刪除", "是否允許將對話用於模型訓練", "相信預設設定一定是最安全的", "分享連結的存取權限"], "a": [0, 1, 3], "e": "預設設定未必最保護隱私，應主動檢查。", "ref": "【好好用 AI 素養計劃】負責任使用 AI（台灣人工智慧學校）；生成式 AI 導入指引－企業應具備的 AI 素養（資策會）"}, {"id": "Q159", "s": 4, "n": 32, "t": "主題3", "sub": "3.1", "sn": "數據隱私、安全和合規", "q": "在哪些情況下，宜考慮採用地端或私有部署的模型？", "o": ["法規要求資料不得出境或離開組織", "任何情況下地端一定比雲端便宜", "有合適的開放權重模型可用", "需處理高敏感資料"], "a": [0, 2, 3], "e": "地端部署可提升資料掌控度，但需考量硬體與維運成本。", "ref": "生成式 AI 導入指引－企業應具備的 AI 素養（資策會）；生成式人工智慧與機器學習導論 2025（李宏毅）"}, {"id": "Q160", "s": 5, "n": 32, "t": "主題3", "sub": "3.1", "sn": "數據隱私、安全和合規", "q": "使用 AI 產出內容時，下列哪些項目特別需要查證？", "o": ["引用的法條", "統計數字", "AI 回覆中的禮貌用語", "只要 AI 語氣肯定就可相信"], "a": [0, 1], "e": "AI 常以肯定語氣呈現錯誤資訊，關鍵事實需查證。禮貌用語不涉及事實正確性。", "ref": "行政院及所屬機關（構）使用生成式 AI 參考指引（行政院）；OWASP GenAI LLM Top 10 2026（OWASP GenAI Security Project）"}, {"id": "Q161", "s": 1, "n": 33, "t": "主題3", "sub": "3.1", "sn": "數據隱私、安全和合規", "q": "我國《人工智慧基本法》揭示的原則包括哪些？", "o": ["永續發展與福祉", "企業利潤最大化", "人類自主", "技術發展優先於人權保障"], "a": [0, 2], "e": "七大原則為永續發展與福祉、人類自主、隱私保護與資料治理、資安與安全、透明與可解釋、公平與不歧視、問責。AI 基本法強調以人為本、保障基本權利。", "ref": "人工智慧基本法（全國法規資料庫）"}, {"id": "Q162", "s": 2, "n": 33, "t": "主題3", "sub": "3.1", "sn": "數據隱私、安全和合規", "q": "下列哪些屬於《人工智慧基本法》所列的原則？", "o": ["透明與可解釋", "問責", "資安與安全", "公平與不歧視"], "a": [0, 1, 2, 3], "e": "四項皆屬 AI 基本法七大原則。", "ref": "人工智慧基本法（全國法規資料庫）"}, {"id": "Q163", "s": 3, "n": 33, "t": "主題3", "sub": "3.1", "sn": "數據隱私、安全和合規", "q": "《人工智慧基本法》的中央主管機關為何？", "o": ["法務部", "內政部", "國家科學及技術委員會", "經濟部"], "a": [2], "e": "AI 基本法第 2 條明定中央主管機關為國科會。", "ref": "人工智慧基本法（全國法規資料庫）"}, {"id": "Q164", "s": 4, "n": 33, "t": "主題3", "sub": "3.1", "sn": "數據隱私、安全和合規", "q": "我國《人工智慧基本法》於何時公布施行？", "o": ["2026 年（民國 115 年）1 月 14 日", "2024 年 12 月 31 日", "2023 年 8 月 31 日", "2027 年 1 月 1 日"], "a": [0], "e": "立法院於 2025 年 12 月 23 日三讀，總統於 2026 年 1 月 14 日公布施行。", "ref": "人工智慧基本法（全國法規資料庫）"}, {"id": "Q165", "s": 5, "n": 33, "t": "主題3", "sub": "3.1", "sn": "數據隱私、安全和合規", "q": "使用生成式 AI 處理他人個人資料時，下列哪些敘述正確？", "o": ["個資的蒐集、處理、利用需符合個人資料保護法", "取得的資料可任意用於原目的以外的用途", "個人資料保護法不適用於 AI 的使用情境", "將他人個資輸入 AI 可能構成個資的利用"], "a": [0, 3], "e": "使用 AI 處理個資同樣受個資法規範，並應遵循資料最小化。個資利用應符合特定目的，不可任意挪用。", "ref": "生成式 AI 導入指引－企業應具備的 AI 素養（資策會）；人工智慧基本法（全國法規資料庫）"}, {"id": "Q166", "s": 1, "n": 34, "t": "主題3", "sub": "3.1", "sn": "數據隱私、安全和合規", "q": "關於生成式 AI 與著作權，下列哪些敘述正確？", "o": ["上傳他人受保護的著作需注意授權", "所有 AI 產出都可自由商用，不必考量權利", "只要改動一個字就不會構成侵權", "應依服務條款確認產出的使用權利"], "a": [0, 3], "e": "使用前後都需注意著作權與服務條款。是否侵權看實質相似，不是改一個字就能避免。", "ref": "【好好用 AI 素養計劃】負責任使用 AI（台灣人工智慧學校）；Responsible Practices for Synthetic Media（Partnership on AI）"}, {"id": "Q167", "s": 2, "n": 34, "t": "主題3", "sub": "3.1", "sn": "數據隱私、安全和合規", "q": "下列哪些可能屬於企業的營業秘密，不宜輸入公開 AI 服務？", "o": ["客戶名單", "未公開的製程參數", "已公開於官網的公司簡介", "已公告的股東會年報內容"], "a": [0, 1], "e": "營業秘密一旦輸入外部服務，可能喪失秘密性。已公開資訊不具秘密性。", "ref": "生成式 AI 導入指引－企業應具備的 AI 素養（資策會）"}, {"id": "Q168", "s": 3, "n": 34, "t": "主題3", "sub": "3.1", "sn": "數據隱私、安全和合規", "q": "OWASP GenAI LLM Top 10 2026 中排名第二的風險是？", "o": ["敏感資訊揭露（Sensitive Information Disclosure）", "供應鏈（Supply Chain）", "錯誤資訊（Misinformation）", "提示注入（Prompt Injection）"], "a": [0], "e": "2026 年版第一名為提示注入，第二名為敏感資訊揭露。", "ref": "OWASP GenAI LLM Top 10 2026（OWASP GenAI Security Project）"}, {"id": "Q169", "s": 4, "n": 34, "t": "主題3", "sub": "3.1", "sn": "數據隱私、安全和合規", "q": "關於「資料最小化」，下列哪些正確？", "o": ["符合隱私保護的精神", "只提供完成任務必要的資料", "可降低資料外洩時的影響", "提供越多資料越好，以免 AI 判斷錯誤"], "a": [0, 1, 2], "e": "資料最小化是隱私保護的基本原則。", "ref": "人工智慧基本法（全國法規資料庫）；生成式 AI 導入指引－企業應具備的 AI 素養（資策會）"}, {"id": "Q170", "s": 5, "n": 34, "t": "主題3", "sub": "3.1", "sn": "數據隱私、安全和合規", "q": "學校行政人員想用 AI 整理學生問卷，下列哪些做法恰當？", "o": ["將含學號姓名的原始檔貼到任何聊天機器人", "使用學校授權的工具", "為求方便以個人帳號處理學生資料", "先將學生資料去識別化"], "a": [1, 3], "e": "處理學生資料需去識別化並遵守校內規範。應使用學校授權的工具與帳號。", "ref": "行政院及所屬機關（構）使用生成式 AI 參考指引（行政院）；【好好用 AI 素養計劃】負責任使用 AI（台灣人工智慧學校）"}, {"id": "Q171", "s": 1, "n": 35, "t": "主題3", "sub": "3.1", "sn": "數據隱私、安全和合規", "q": "依資策會生成式 AI 導入指引的精神，企業應具備哪些 AI 素養與作為？", "o": ["了解生成式 AI 的使用風險", "建立內部使用規範", "不需任何管理，讓員工自由使用", "對員工進行教育訓練"], "a": [0, 1, 3], "e": "企業導入需兼顧風險意識、規範與教育訓練。", "ref": "生成式 AI 導入指引－企業應具備的 AI 素養（資策會）"}, {"id": "Q172", "s": 2, "n": 35, "t": "主題3", "sub": "3.1", "sn": "數據隱私、安全和合規", "q": "避免使用到假冒或惡意的 AI 工具，下列哪些做法恰當？", "o": ["不在來路不明的網站輸入帳號密碼", "任何瀏覽器擴充功能都可放心安裝", "只從官方管道下載應用程式", "留意名稱相似的假冒 App"], "a": [0, 2, 3], "e": "假冒 AI 工具可能竊取帳密或資料。", "ref": "生成式 AI 導入指引－企業應具備的 AI 素養（資策會）；OWASP GenAI LLM Top 10 2026（OWASP GenAI Security Project）"}, {"id": "Q173", "s": 3, "n": 35, "t": "主題3", "sub": "3.1", "sn": "數據隱私、安全和合規", "q": "關於分享 AI 對話連結，下列哪些敘述正確？", "o": ["分享連結會自動遮蔽所有個資", "分享連結永遠只有自己能看到", "連結可能被轉傳給他人", "分享前應檢查是否含敏感資訊"], "a": [2, 3], "e": "分享連結可能讓他人看到完整對話內容。分享連結不會自動遮蔽個資。", "ref": "【好好用 AI 素養計劃】負責任使用 AI（台灣人工智慧學校）"}, {"id": "Q174", "s": 4, "n": 35, "t": "主題3", "sub": "3.1", "sn": "數據隱私、安全和合規", "q": "使用公開生成式 AI 服務時，正確的心態包括哪些？", "o": ["視其為只有自己能看的私人日記", "需遵守組織政策", "視其為對外公開的場所", "不該公開的資訊就不要輸入"], "a": [1, 2, 3], "e": "把公開服務當作外部場所，可避免輸入不該外流的資訊。", "ref": "行政院及所屬機關（構）使用生成式 AI 參考指引（行政院）；【好好用 AI 素養計劃】負責任使用 AI（台灣人工智慧學校）"}, {"id": "Q175", "s": 5, "n": 35, "t": "主題3", "sub": "3.1", "sn": "數據隱私、安全和合規", "q": "發現自己可能將機密資料輸入 AI 服務後，應採取哪些行動？", "o": ["隱瞞不報以免被追究", "保留相關紀錄以利處理", "停止相關使用", "立即向資安或主管窗口通報"], "a": [1, 2, 3], "e": "及早通報能降低損害並啟動應變程序。", "ref": "行政院及所屬機關（構）使用生成式 AI 參考指引（行政院）；生成式 AI 導入指引－企業應具備的 AI 素養（資策會）"}, {"id": "Q176", "s": 1, "n": 36, "t": "主題3", "sub": "3.2", "sn": "倫理考量和負責任使用", "q": "生成式 AI 回應中的偏見可能來自哪些因素？", "o": ["訓練資料中的社會刻板印象", "提示用語與評估方式的設計", "某些族群或語言的資料代表性不足", "模型天生中立，不可能有偏見"], "a": [0, 1, 2], "e": "偏見源自資料、代表性與設計，AI 並非天生中立。", "ref": "What is AI Ethics?（IBM）；Embrace Responsible AI Principles and Practices（Microsoft Learn）"}, {"id": "Q177", "s": 2, "n": 36, "t": "主題3", "sub": "3.2", "sn": "倫理考量和負責任使用", "q": "下列哪些可能是 AI 偏見的表現？", "o": ["模型回答速度偶爾較慢", "計算機正確算出加法結果", "生成「工程師」圖片多為男性", "履歷篩選對特定族群不利"], "a": [2, 3], "e": "偏見會造成刻板印象、品質落差與不公平決策。回應速度與偏見無關。", "ref": "What is AI Ethics?（IBM）；Embrace Responsible AI Principles and Practices（Microsoft Learn）；【好好用 AI 素養計劃】負責任使用 AI（台灣人工智慧學校）"}, {"id": "Q178", "s": 3, "n": 36, "t": "主題3", "sub": "3.2", "sn": "倫理考量和負責任使用", "q": "使用者降低 AI 偏見影響的做法包括哪些？", "o": ["察覺輸出中的刻板印象", "由不同背景的人共同審閱", "要求提供多元觀點", "回報有偏見的輸出"], "a": [0, 1, 2, 3], "e": "四項皆是使用者可採取的做法；但不應以 AI 結果作唯一依據。", "ref": "What is AI Ethics?（IBM）；Embrace Responsible AI Principles and Practices（Microsoft Learn）"}, {"id": "Q179", "s": 4, "n": 36, "t": "主題3", "sub": "3.2", "sn": "倫理考量和負責任使用", "q": "關於 AI 的「公平性」，下列哪些正確？", "o": ["是 Microsoft 負責任 AI 原則之一", "需檢視模型對不同群體的表現差異", "AI 應公平對待不同群體", "是 IBM AI 倫理的核心支柱之一"], "a": [0, 1, 2, 3], "e": "四項皆正確；公平性需檢視各群體表現，而非只看整體準確率。", "ref": "What is AI Ethics?（IBM）；Embrace Responsible AI Principles and Practices（Microsoft Learn）"}, {"id": "Q180", "s": 5, "n": 36, "t": "主題3", "sub": "3.2", "sn": "倫理考量和負責任使用", "q": "在決策中倫理使用 AI，下列哪些做法恰當？", "o": ["AI 結果僅作為參考", "保留申訴與救濟管道", "為求效率全面自動化，不設人工審核", "影響個人權益的決定由人做最終判斷"], "a": [0, 1, 3], "e": "涉及權益的決策應保留人的判斷與救濟管道。", "ref": "OECD AI Principles（OECD）；Ethical Impact Assessment（UNESCO）"}, {"id": "Q181", "s": 1, "n": 37, "t": "主題3", "sub": "3.2", "sn": "倫理考量和負責任使用", "q": "關於使用 AI 的「透明度」，下列哪些正確？", "o": ["說明 AI 參與的範圍", "刻意隱瞞 AI 的使用以免被質疑", "告知對方哪些內容由 AI 協助產生", "只有在被發現時才承認使用 AI"], "a": [0, 2], "e": "透明揭露有助建立信任，也是多數原則框架的要求。透明應主動揭露。", "ref": "OECD AI Principles（OECD）；Embrace Responsible AI Principles and Practices（Microsoft Learn）；行政院及所屬機關（構）使用生成式 AI 參考指引（行政院）"}, {"id": "Q182", "s": 2, "n": 37, "t": "主題3", "sub": "3.2", "sn": "倫理考量和負責任使用", "q": "關於使用 AI 的「問責」，下列哪些正確？", "o": ["錯誤由 AI 供應商全權負責，使用者不必檢查", "使用者與單位須對成果負責", "保留紀錄以便追溯與改正", "「這是 AI 說的」不能作為免責理由"], "a": [1, 2, 3], "e": "問責要求清楚的責任歸屬，使用者仍需把關。", "ref": "OECD AI Principles（OECD）；人工智慧基本法（全國法規資料庫）"}, {"id": "Q183", "s": 3, "n": 37, "t": "主題3", "sub": "3.2", "sn": "倫理考量和負責任使用", "q": "Microsoft 負責任 AI 原則包括哪些？", "o": ["公平", "可靠與安全", "隱私與安全性", "包容"], "a": [0, 1, 2, 3], "e": "Microsoft 六大原則：公平、可靠與安全、隱私與安全性、包容、透明、當責。", "ref": "Embrace Responsible AI Principles and Practices（Microsoft Learn）"}, {"id": "Q184", "s": 4, "n": 37, "t": "主題3", "sub": "3.2", "sn": "倫理考量和負責任使用", "q": "除題目所列之外，Microsoft 負責任 AI 六大原則還包括哪些？（已知：公平、可靠與安全、隱私與安全性、包容）", "o": ["透明", "獲利", "速度", "當責"], "a": [0, 3], "e": "其餘兩項為透明（Transparency）與當責（Accountability）。", "ref": "Embrace Responsible AI Principles and Practices（Microsoft Learn）"}, {"id": "Q185", "s": 5, "n": 37, "t": "主題3", "sub": "3.2", "sn": "倫理考量和負責任使用", "q": "OECD AI 原則的價值導向原則包括哪些？", "o": ["尊重法治、人權與民主價值（含公平與隱私）", "包容性成長、永續發展與福祉", "透明與可解釋", "穩健、資安與安全"], "a": [0, 1, 2, 3], "e": "OECD 五項價值原則還包括第五項「問責」。", "ref": "OECD AI Principles（OECD）"}, {"id": "Q186", "s": 1, "n": 38, "t": "主題3", "sub": "3.2", "sn": "倫理考量和負責任使用", "q": "OECD AI 原則的五項價值導向原則中，除包容成長、人權、透明、穩健安全外，另一項是？", "o": ["市場獨占", "全面自動化", "問責（Accountability）", "利潤最大化"], "a": [2], "e": "問責是 OECD 五大價值原則之一。", "ref": "OECD AI Principles（OECD）"}, {"id": "Q187", "s": 2, "n": 38, "t": "主題3", "sub": "3.2", "sn": "倫理考量和負責任使用", "q": "IBM 說明 AI 倫理時提出的支柱包括哪些？", "o": ["公平性", "穩健性", "透明度", "可解釋性"], "a": [0, 1, 2, 3], "e": "IBM 的 AI 倫理支柱為可解釋性、公平性、穩健性、透明度與隱私。", "ref": "What is AI Ethics?（IBM）"}, {"id": "Q188", "s": 3, "n": 38, "t": "主題3", "sub": "3.2", "sn": "倫理考量和負責任使用", "q": "關於 UNESCO 的倫理影響評估（Ethical Impact Assessment, EIA），下列哪些正確？", "o": ["只能在系統上市後使用", "以 UNESCO《人工智慧倫理建議書》為基礎", "涵蓋 AI 系統的整個生命週期", "用於評估 AI 系統對人權與社會的影響"], "a": [1, 2, 3], "e": "EIA 協助在設計、採購到使用的各階段評估倫理影響。", "ref": "Ethical Impact Assessment（UNESCO）"}, {"id": "Q189", "s": 4, "n": 38, "t": "主題3", "sub": "3.2", "sn": "倫理考量和負責任使用", "q": "UNESCO《人工智慧倫理建議書》強調的核心價值包括哪些？", "o": ["尊重人權與人性尊嚴", "環境與生態系的永續", "只追求技術效能", "多元與包容"], "a": [0, 1, 3], "e": "建議書以人權、尊嚴、包容與永續為核心價值。", "ref": "Ethical Impact Assessment（UNESCO）"}, {"id": "Q190", "s": 5, "n": 38, "t": "主題3", "sub": "3.2", "sn": "倫理考量和負責任使用", "q": "各國際負責任 AI 原則框架的共同交集包括哪些？", "o": ["公平", "隱私", "透明", "問責"], "a": [0, 1, 2, 3], "e": "OECD、Microsoft、IBM、UNESCO 與我國 AI 基本法均涵蓋這些概念。", "ref": "OECD AI Principles（OECD）；Embrace Responsible AI Principles and Practices（Microsoft Learn）；What is AI Ethics?（IBM）；人工智慧基本法（全國法規資料庫）"}, {"id": "Q191", "s": 1, "n": 39, "t": "主題3", "sub": "3.2", "sn": "倫理考量和負責任使用", "q": "使用 AI 協助決策前，可用哪些問題自我檢核？", "o": ["我能解釋 AI 在其中做了什麼嗎？", "這份報告用了哪一種字型？", "這個決定會影響到誰？", "出錯時由誰負責、如何補救？"], "a": [0, 2, 3], "e": "影響、可解釋與責任是倫理檢核的三個面向。", "ref": "Ethical Impact Assessment（UNESCO）；OECD AI Principles（OECD）"}, {"id": "Q192", "s": 2, "n": 39, "t": "主題3", "sub": "3.2", "sn": "倫理考量和負責任使用", "q": "在學術或工作上使用 AI，符合誠信的做法包括哪些？", "o": ["查證 AI 提供的引用", "不將 AI 產出冒充為自己的原創", "依規定揭露 AI 的使用", "AI 捏造的引用文獻可直接使用"], "a": [0, 1, 2], "e": "誠信使用包括揭露、不冒用與查證引用。", "ref": "【好好用 AI 素養計劃】負責任使用 AI（台灣人工智慧學校）；行政院及所屬機關（構）使用生成式 AI 參考指引（行政院）"}, {"id": "Q193", "s": 3, "n": 39, "t": "主題3", "sub": "3.2", "sn": "倫理考量和負責任使用", "q": "教師使用 AI 協助評分學生作業時，下列哪些做法恰當？", "o": ["提供申訴管道", "由教師做最終判斷", "完全依照 AI 評分結果", "事先告知學生"], "a": [0, 1, 3], "e": "涉及學生權益的評量應由教師負責並保持透明。", "ref": "Ethical Impact Assessment（UNESCO）；Embrace Responsible AI Principles and Practices（Microsoft Learn）"}, {"id": "Q194", "s": 4, "n": 39, "t": "主題3", "sub": "3.2", "sn": "倫理考量和負責任使用", "q": "企業在招募中使用 AI 篩選履歷，應採取哪些措施？", "o": ["檢視模型是否存在偏見", "由人工複核篩選結果", "以 AI 分數作為唯一淘汰依據", "以應徵者的性別作為模型輸入特徵"], "a": [0, 1], "e": "招募屬高影響決策，需防範偏見並保留人工判斷。以性別作為篩選依據可能構成歧視。", "ref": "What is AI Ethics?（IBM）；Embrace Responsible AI Principles and Practices（Microsoft Learn）"}, {"id": "Q195", "s": 5, "n": 39, "t": "主題3", "sub": "3.2", "sn": "倫理考量和負責任使用", "q": "關於「人類自主」原則，下列哪些正確？", "o": ["尊重人的決定權", "由 AI 取代人類做出所有決定", "是我國 AI 基本法的原則之一", "允許人類對 AI 進行監督"], "a": [0, 2, 3], "e": "AI 基本法要求 AI 支持人類自主並允許人類監督。", "ref": "人工智慧基本法（全國法規資料庫）"}, {"id": "Q196", "s": 1, "n": 40, "t": "主題3", "sub": "3.2", "sn": "倫理考量和負責任使用", "q": "關於 AI 的「可解釋性」，下列哪些正確？", "o": ["高風險決策更需要可解釋性", "有助建立使用者信任", "所有深度學習模型都能被完整解釋", "能說明產出的依據"], "a": [0, 1, 3], "e": "深度學習常被視為黑箱，可解釋性是重要的研究與治理課題。", "ref": "What is AI Ethics?（IBM）；OECD AI Principles（OECD）"}, {"id": "Q197", "s": 2, "n": 40, "t": "主題3", "sub": "3.2", "sn": "倫理考量和負責任使用", "q": "關於「包容性」原則，下列哪些正確？", "o": ["只需為多數使用者設計", "為降低成本省略字幕與替代文字", "是 Microsoft 負責任 AI 原則之一", "考量身心障礙者等不同使用者的需求"], "a": [2, 3], "e": "包容性要求 AI 讓所有人都能受益與使用。省略無障礙設計違反包容原則。", "ref": "Embrace Responsible AI Principles and Practices（Microsoft Learn）"}, {"id": "Q198", "s": 3, "n": 40, "t": "主題3", "sub": "3.2", "sn": "倫理考量和負責任使用", "q": "下列哪些屬於生成式 AI 的不當使用？", "o": ["生成他人的不實影像", "以 AI 協助校稿並經人工審閱", "未經同意模仿他人聲音", "散布 AI 生成的假訊息"], "a": [0, 2, 3], "e": "製造或散布不實內容、未經同意模仿他人均屬不當使用。", "ref": "Responsible Practices for Synthetic Media（Partnership on AI）；【好好用 AI 素養計劃】負責任使用 AI（台灣人工智慧學校）"}, {"id": "Q199", "s": 4, "n": 40, "t": "主題3", "sub": "3.2", "sn": "倫理考量和負責任使用", "q": "台灣人工智慧學校與 Meta 的「好好用 AI」教材特別關注哪些 AI 使用風險？", "o": ["智慧財產權侵犯", "資訊錯誤", "只教 AI 工具的操作步驟", "隱私外洩"], "a": [0, 1, 3], "e": "該教材定位為台灣第一套聚焦 AI 使用風險的教材。", "ref": "【好好用 AI 素養計劃】負責任使用 AI（台灣人工智慧學校）"}, {"id": "Q200", "s": 5, "n": 40, "t": "主題3", "sub": "3.2", "sn": "倫理考量和負責任使用", "q": "提交 AI 輔助完成的工作成果時，適當的揭露內容包括哪些？", "o": ["哪些部分由 AI 協助", "由誰審閱確認", "不需做任何說明", "使用了哪些工具"], "a": [0, 1, 3], "e": "揭露 AI 參與範圍與審閱者，有助透明與問責。", "ref": "行政院及所屬機關（構）使用生成式 AI 參考指引（行政院）；OECD AI Principles（OECD）"}, {"id": "Q201", "s": 1, "n": 41, "t": "主題3", "sub": "3.3", "sn": "AI 資訊安全與治理", "q": "關於「AI 治理」，下列哪些正確？", "o": ["指的只是購買 AI 軟體", "是確保 AI 合法、安全、合乎倫理的政策、角色、流程與監督機制", "有助降低風險並建立信任", "協助組織符合法規要求"], "a": [1, 2, 3], "e": "AI 治理涵蓋制度與流程，不只是採購工具。", "ref": "OECD AI Principles（OECD）；生成式 AI 導入指引－企業應具備的 AI 素養（資策會）"}, {"id": "Q202", "s": 2, "n": 41, "t": "主題3", "sub": "3.3", "sn": "AI 資訊安全與治理", "q": "組織的 AI 治理通常包含哪些要素？", "o": ["使用政策", "角色與責任分工", "監控與稽核", "風險分級"], "a": [0, 1, 2, 3], "e": "政策、角色、風險分級與監控稽核是治理的核心要素。", "ref": "生成式 AI 導入指引－企業應具備的 AI 素養（資策會）；OECD AI Principles（OECD）"}, {"id": "Q203", "s": 3, "n": 41, "t": "主題3", "sub": "3.3", "sn": "AI 資訊安全與治理", "q": "關於「以風險為基礎」的 AI 管理方式，下列哪些正確？", "o": ["是我國 AI 基本法採取的方向", "所有 AI 應用一律禁止", "依 AI 應用的影響程度採取不同強度的管控", "高風險應用需更嚴格的要求"], "a": [0, 2, 3], "e": "以風險為基礎兼顧創新與保護。", "ref": "人工智慧基本法（全國法規資料庫）"}, {"id": "Q204", "s": 4, "n": 41, "t": "主題3", "sub": "3.3", "sn": "AI 資訊安全與治理", "q": "依《人工智慧基本法》，負責訂定 AI 風險分類框架的機關是？", "o": ["數位發展部", "教育部", "國家科學及技術委員會", "衛生福利部"], "a": [0], "e": "AI 基本法授權數位發展部訂定風險分類框架，各目的事業主管機關據以訂定規範。", "ref": "人工智慧基本法（全國法規資料庫）"}, {"id": "Q205", "s": 5, "n": 41, "t": "主題3", "sub": "3.3", "sn": "AI 資訊安全與治理", "q": "OWASP GenAI LLM Top 10 2026 中排名第一的風險是？", "o": ["敏感資訊揭露", "過度代理", "提示注入（Prompt Injection）", "不當輸出處理"], "a": [2], "e": "提示注入在歷屆版本中都排名第一。", "ref": "OWASP GenAI LLM Top 10 2026（OWASP GenAI Security Project）"}, {"id": "Q206", "s": 1, "n": 42, "t": "主題3", "sub": "3.3", "sn": "AI 資訊安全與治理", "q": "OWASP GenAI LLM Top 10 2026 中排名第三、較前版大幅上升的風險是？", "o": ["供應鏈", "過度代理（Excessive Agency）", "敏感資訊揭露", "錯誤資訊"], "a": [1], "e": "2026 年版中過度代理由第 6 名升至第 3 名，反映 AI Agent 的風險。", "ref": "OWASP GenAI LLM Top 10 2026（OWASP GenAI Security Project）"}, {"id": "Q207", "s": 2, "n": 42, "t": "主題3", "sub": "3.3", "sn": "AI 資訊安全與治理", "q": "下列哪些屬於 OWASP GenAI LLM Top 10 2026 所列的風險？", "o": ["無限制資源消耗", "向量與嵌入弱點", "硬碟碎片化", "資料與模型投毒"], "a": [0, 1, 3], "e": "硬碟碎片化與 LLM 應用安全無關。", "ref": "OWASP GenAI LLM Top 10 2026（OWASP GenAI Security Project）"}, {"id": "Q208", "s": 3, "n": 42, "t": "主題3", "sub": "3.3", "sn": "AI 資訊安全與治理", "q": "OWASP GenAI LLM Top 10 2026 相較 2025 年版的變化，下列哪些正確？", "o": ["不當輸出處理降至第 10 名", "系統提示洩漏擴大為「隱藏上下文暴露」", "過度代理的排名上升", "提示注入跌出前十名"], "a": [0, 1, 2], "e": "提示注入仍居第一；其餘三項為 2026 年版的主要變化。", "ref": "OWASP GenAI LLM Top 10 2026（OWASP GenAI Security Project）"}, {"id": "Q209", "s": 4, "n": 42, "t": "主題3", "sub": "3.3", "sn": "AI 資訊安全與治理", "q": "下列哪些屬於「直接提示注入」？", "o": ["惡意指令藏在 AI 讀取的網頁中", "輸入「忽略先前所有指示」試圖改變 AI 行為", "試圖讓 AI 洩漏系統設定", "俗稱的「越獄（Jailbreak）」嘗試"], "a": [1, 2, 3], "e": "藏在外部內容中的指令屬於間接提示注入。", "ref": "OWASP GenAI LLM Top 10 2026（OWASP GenAI Security Project）"}, {"id": "Q210", "s": 5, "n": 42, "t": "主題3", "sub": "3.3", "sn": "AI 資訊安全與治理", "q": "「間接提示注入」的惡意指令可能藏在哪裡？", "o": ["電子郵件", "網頁", "文件或圖片", "使用者自己直接輸入的對話框"], "a": [0, 1, 2], "e": "間接注入是透過 AI 讀取的外部內容夾帶指令。", "ref": "OWASP GenAI LLM Top 10 2026（OWASP GenAI Security Project）"}, {"id": "Q211", "s": 1, "n": 43, "t": "主題3", "sub": "3.3", "sn": "AI 資訊安全與治理", "q": "防範提示注入的做法包括哪些？", "o": ["AI Agent 只給予最小權限", "讓 AI Agent 自動執行郵件中的所有指示", "把外部內容視為資料，而非指令", "把系統密碼寫進系統提示方便 AI 使用"], "a": [0, 2], "e": "最小權限與人工確認能限制注入造成的損害。密碼放在提示中可能因注入而外洩。", "ref": "OWASP GenAI LLM Top 10 2026（OWASP GenAI Security Project）"}, {"id": "Q212", "s": 2, "n": 43, "t": "主題3", "sub": "3.3", "sn": "AI 資訊安全與治理", "q": "下列哪些屬於「對抗性攻擊」？", "o": ["一般使用者的正常提問", "提示注入", "資料投毒", "刻意設計輸入使模型判斷錯誤"], "a": [1, 2, 3], "e": "對抗性攻擊泛指刻意操控 AI 輸入或資料以造成錯誤行為。", "ref": "OWASP GenAI LLM Top 10 2026（OWASP GenAI Security Project）"}, {"id": "Q213", "s": 3, "n": 43, "t": "主題3", "sub": "3.3", "sn": "AI 資訊安全與治理", "q": "關於「資料與模型投毒」，下列哪些正確？", "o": ["可能來自被竄改的公開資料集", "可能植入只在特定條件觸發的後門", "竄改訓練或微調資料", "影響模型的行為"], "a": [0, 1, 2, 3], "e": "四項皆正確；投毒可透過公開資料集或微調資料植入。", "ref": "OWASP GenAI LLM Top 10 2026（OWASP GenAI Security Project）"}, {"id": "Q214", "s": 4, "n": 43, "t": "主題3", "sub": "3.3", "sn": "AI 資訊安全與治理", "q": "關於「過度代理（Excessive Agency）」，下列哪些正確？", "o": ["可能讓錯誤的輸出變成錯誤的行動", "AI Agent 的權限超過任務所需", "對刪除、付款等高風險動作加上人工確認可降低影響", "以最小權限原則降低風險"], "a": [0, 1, 2, 3], "e": "四項皆正確；最小權限與人工確認是主要對策。", "ref": "OWASP GenAI LLM Top 10 2026（OWASP GenAI Security Project）"}, {"id": "Q215", "s": 5, "n": 43, "t": "主題3", "sub": "3.3", "sn": "AI 資訊安全與治理", "q": "關於「不當輸出處理」，下列哪些正確？", "o": ["模型輸出可直接當成程式執行", "未經驗證就把模型輸出傳入其他系統", "可能造成 XSS 或 SQL 注入等問題", "應將模型輸出視為不可信的輸入"], "a": [1, 2, 3], "e": "模型輸出需經驗證與過濾後才能交給下游系統。", "ref": "OWASP GenAI LLM Top 10 2026（OWASP GenAI Security Project）"}, {"id": "Q216", "s": 1, "n": 44, "t": "主題3", "sub": "3.3", "sn": "AI 資訊安全與治理", "q": "關於 OWASP 所列的「錯誤資訊（Misinformation）」風險，下列哪些正確？", "o": ["可能捏造引用來源", "模型產生錯誤或不安全的資訊", "可透過 RAG 與查證流程降低", "只要模型夠大就不會發生"], "a": [0, 1, 2], "e": "錯誤資訊與幻覺相關，任何規模的模型都可能發生。", "ref": "OWASP GenAI LLM Top 10 2026（OWASP GenAI Security Project）"}, {"id": "Q217", "s": 2, "n": 44, "t": "主題3", "sub": "3.3", "sn": "AI 資訊安全與治理", "q": "關於「無限制資源消耗（Unbounded Consumption）」，下列哪些正確？", "o": ["可能被用來竊取模型", "可用速率限制與配額緩解", "大量查詢可能耗盡預算", "可能造成服務中斷"], "a": [0, 1, 2, 3], "e": "四項皆屬此風險的範圍或對策。", "ref": "OWASP GenAI LLM Top 10 2026（OWASP GenAI Security Project）"}, {"id": "Q218", "s": 3, "n": 44, "t": "主題3", "sub": "3.3", "sn": "AI 資訊安全與治理", "q": "下列哪些屬於深度偽造（Deepfake）的常見詐騙手法？", "o": ["已明確標示為 AI 生成的教學影片", "偽冒主管視訊或語音要求緊急匯款", "合成不實照片散布謠言", "名人假影片推銷投資"], "a": [1, 2, 3], "e": "深度偽造的危害在於冒充與欺騙；明確標示的合成內容不屬詐騙。", "ref": "Responsible Practices for Synthetic Media（Partnership on AI）；Content Credentials（C2PA）"}, {"id": "Q219", "s": 4, "n": 44, "t": "主題3", "sub": "3.3", "sn": "AI 資訊安全與治理", "q": "辨識深度偽造內容的線索包括哪些？", "o": ["光影、邊緣、手指等細節異常", "影片解析度高就一定是真的", "只要聽得到聲音就一定是本人", "嘴型與聲音不同步、表情僵硬"], "a": [0, 3], "e": "高畫質偽造越來越多，除視覺線索外更要注意情境與流程。聲音也可以被深度偽造。", "ref": "Responsible Practices for Synthetic Media（Partnership on AI）；【好好用 AI 素養計劃】負責任使用 AI（台灣人工智慧學校）"}, {"id": "Q220", "s": 5, "n": 44, "t": "主題3", "sub": "3.3", "sn": "AI 資訊安全與治理", "q": "防範深度偽造詐騙的做法包括哪些？", "o": ["依視訊中的指示立即匯款", "以另一個既有管道回撥查證", "建立內部通關密語", "涉及金錢時採雙人覆核"], "a": [1, 2, 3], "e": "以獨立管道查證與流程控管是最有效的防線。", "ref": "Responsible Practices for Synthetic Media（Partnership on AI）；【好好用 AI 素養計劃】負責任使用 AI（台灣人工智慧學校）"}, {"id": "Q221", "s": 1, "n": 45, "t": "主題3", "sub": "3.3", "sn": "AI 資訊安全與治理", "q": "關於 C2PA 內容憑證（Content Credentials），下列哪些正確？", "o": ["可以自動刪除網路上所有的假影片", "可標示內容是否由 AI 生成", "在檔案中加入可驗證的來源與編輯紀錄", "能保證內容所陳述的事實完全正確"], "a": [1, 2], "e": "內容憑證記錄來源與編輯歷程，但不判斷內容事實真偽。內容憑證用於溯源，無法刪除假影片。", "ref": "Content Credentials（C2PA）"}, {"id": "Q222", "s": 2, "n": 45, "t": "主題3", "sub": "3.3", "sn": "AI 資訊安全與治理", "q": "Partnership on AI 的合成媒體負責任實踐，強調哪些原則？", "o": ["透明", "取得當事人同意", "揭露內容為合成", "匿名散布以避免追查"], "a": [0, 1, 2], "e": "該框架針對開發者、創作者與散布者，強調同意、揭露與透明。", "ref": "Responsible Practices for Synthetic Media（Partnership on AI）"}, {"id": "Q223", "s": 3, "n": 45, "t": "主題3", "sub": "3.3", "sn": "AI 資訊安全與治理", "q": "自行製作 AI 合成影像或聲音時，應注意哪些事項？", "o": ["主動揭露為 AI 合成", "模仿真人不需告知任何人", "避免造成誤導", "取得當事人同意"], "a": [0, 2, 3], "e": "負責任的合成媒體需同意、揭露並避免誤導。", "ref": "Responsible Practices for Synthetic Media（Partnership on AI）"}, {"id": "Q224", "s": 4, "n": 45, "t": "主題3", "sub": "3.3", "sn": "AI 資訊安全與治理", "q": "關於 OWASP GenAI LLM Top 10，下列哪些正確？", "o": ["AI Agent 應用宜搭配 OWASP Agentic Top 10 一起參考", "是社群共同維護的風險清單", "是具法律強制力的認證標準", "由 OWASP GenAI Security Project 發布"], "a": [0, 1, 3], "e": "它是風險認知與威脅建模指引，不是法規或認證。", "ref": "OWASP GenAI LLM Top 10 2026（OWASP GenAI Security Project）"}, {"id": "Q225", "s": 5, "n": 45, "t": "主題3", "sub": "3.3", "sn": "AI 資訊安全與治理", "q": "OWASP 2026 年版的「隱藏上下文暴露（Hidden Context Exposure）」涵蓋哪些資訊外洩？", "o": ["系統提示（System Prompt）", "使用者本來就看得到的回答內容", "隱藏的政策或路由邏輯", "RAG 檢索的文件與結構"], "a": [0, 2, 3], "e": "此項擴大了原本「系統提示洩漏」的範圍，涵蓋所有使用者不可見的上下文。", "ref": "OWASP GenAI LLM Top 10 2026（OWASP GenAI Security Project）"}, {"id": "Q226", "s": 1, "n": 46, "t": "主題4", "sub": "4.1", "sn": "故障排除和問題解決", "q": "AI 回答出現幻覺或捏造內容時，下列哪些處理方式恰當？", "o": ["人工查證關鍵內容", "調高溫度讓回答更有創意", "提供可依據的參考資料", "要求附上資料來源"], "a": [0, 2, 3], "e": "提高溫度會增加隨機性，反而可能加劇錯誤。", "ref": "Prompt Engineering Overview（Anthropic）；Prompt Engineering（OpenAI）"}, {"id": "Q227", "s": 2, "n": 46, "t": "主題4", "sub": "4.1", "sn": "故障排除和問題解決", "q": "AI 提供的資訊已經過時，下列哪些處理方式恰當？", "o": ["貼上最新資料要求依此回答", "既然是 AI 說的就直接相信", "使用具搜尋功能的工具", "重新整理網頁就能讓模型知識更新"], "a": [0, 2], "e": "模型知識有截止日，需以最新資料補足。重新整理網頁不會更新模型知識。", "ref": "Generative AI for Everyone（Andrew Ng／DeepLearning.AI）；Intro to Large Language Models (LLMs)（Codecademy）"}, {"id": "Q228", "s": 3, "n": 46, "t": "主題4", "sub": "4.1", "sn": "故障排除和問題解決", "q": "AI 的回答「答非所問」時，可以如何改善？", "o": ["重複貼上同一個模糊提示", "將任務拆解成較小步驟", "提供期望輸出的範例", "補充角色、目的與讀者等上下文"], "a": [1, 2, 3], "e": "答非所問多半源自提示不清，應補充資訊而非重複送出。", "ref": "Prompt Engineering（OpenAI）；Prompt Engineering Overview（Anthropic）"}, {"id": "Q229", "s": 4, "n": 46, "t": "主題4", "sub": "4.1", "sn": "故障排除和問題解決", "q": "AI 的輸出格式不符需求時，下列哪些做法恰當？", "o": ["明確指定表格或條列格式", "在追問中具體指出不符之處並要求修正", "提供範例格式", "指定欄位與字數"], "a": [0, 1, 2, 3], "e": "四項皆是改善輸出格式的做法。", "ref": "Prompt Engineering: Overview and Guide（Google Cloud）；Prompt Engineering（OpenAI）"}, {"id": "Q230", "s": 5, "n": 46, "t": "主題4", "sub": "4.1", "sn": "故障排除和問題解決", "q": "長時間對話後 AI 開始遺忘前文或失焦，下列哪些敘述正確？", "o": ["更換字型就能解決", "可能是超出上下文視窗", "可先摘要重點後開新對話", "持續貼入更多資料就能解決"], "a": [1, 2], "e": "上下文有長度上限，摘要與分段是常見對策。字型與上下文長度無關。", "ref": "Intro to Large Language Models (LLMs)（Codecademy）；Prompt Engineering Overview（Anthropic）"}, {"id": "Q231", "s": 1, "n": 47, "t": "主題4", "sub": "4.1", "sn": "故障排除和問題解決", "q": "同樣的問題每次得到差異很大的回答，可以如何處理？", "o": ["降低溫度設定（若工具提供）", "使用固定的提示範本", "多次產生後比對", "生成式 AI 沒有隨機性，所以一定是系統故障"
